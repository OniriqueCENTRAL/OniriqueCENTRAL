<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- ONIRIQUE Navigateur : une sphère de nuit, une orbite d'os et l'étoile à quatre branches de la charte. -->
  <defs>
    <radialGradient id="sphere" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#3a1118"/>
      <stop offset=".45" stop-color="#1a0b0e"/>
      <stop offset="1" stop-color="#09080A"/>
    </radialGradient>
    <radialGradient id="braise" cx="28%" cy="82%" r="62%">
      <stop offset="0" stop-color="#E5384A" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#7A0D1C" stop-opacity=".75"/>
      <stop offset="1" stop-color="#7A0D1C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB3BB" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#F4ECEC" stop-opacity=".05"/>
      <stop offset="1" stop-color="#E5384A" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="orbite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4ECEC" stop-opacity=".25"/>
      <stop offset=".55" stop-color="#F4ECEC"/>
      <stop offset="1" stop-color="#FFB3BB"/>
    </linearGradient>
    <clipPath id="dans"><circle cx="512" cy="512" r="400"/></clipPath>
    <!-- La moitié avant de l'orbite (passe devant la sphère) -->
    <clipPath id="avant"><rect x="0" y="512" width="1024" height="512" transform="rotate(-24 512 512)"/></clipPath>
    <filter id="lueur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="douce" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Orbite, moitié arrière (derrière la sphère) -->
  <ellipse cx="512" cy="512" rx="470" ry="150" transform="rotate(-24 512 512)" fill="none" stroke="#F4ECEC" stroke-opacity=".28" stroke-width="16"/>

  <!-- Sphère -->
  <circle cx="512" cy="512" r="400" fill="url(#sphere)"/>
  <circle cx="512" cy="512" r="400" fill="url(#braise)"/>
  <g clip-path="url(#dans)">
    <!-- Méridiens et parallèles discrets : un globe, celui du web -->
    <g fill="none" stroke="#F4ECEC" stroke-opacity=".09" stroke-width="5">
      <ellipse cx="512" cy="512" rx="160" ry="400"/>
      <ellipse cx="512" cy="512" rx="310" ry="400"/>
      <line x1="112" y1="512" x2="912" y2="512"/>
      <ellipse cx="512" cy="512" rx="400" ry="130" transform="translate(0 -170) scale(1 1)"/>
    </g>
    <circle cx="380" cy="300" r="190" fill="#FFB3BB" fill-opacity=".07" filter="url(#lueur)"/>
  </g>
  <circle cx="512" cy="512" r="398" fill="none" stroke="url(#bord)" stroke-width="8"/>

  <!-- Orbite, moitié avant -->
  <g clip-path="url(#avant)">
    <ellipse cx="512" cy="512" rx="470" ry="150" transform="rotate(-24 512 512)" fill="none" stroke="url(#orbite)" stroke-width="18" stroke-linecap="round"/>
  </g>

  <!-- L'étoile à quatre branches, sur l'orbite -->
  <g transform="translate(838 300)">
    <circle r="70" fill="#E5384A" opacity=".55" filter="url(#lueur)"/>
    <path d="M0,-118 C10,-22 22,-10 118,0 C22,10 10,22 0,118 C-10,22 -22,10 -118,0 C-22,-10 -10,-22 0,-118Z" fill="#FFFFFF" filter="url(#douce)" opacity=".7"/>
    <path d="M0,-118 C10,-22 22,-10 118,0 C22,10 10,22 0,118 C-10,22 -22,10 -118,0 C-22,-10 -10,-22 0,-118Z" fill="#FFF7F8"/>
  </g>
</svg>
