<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'">
<title>ONIRIQUE FONDATEURS</title>
<style>
  @font-face { font-family: 'Unbounded'; src: url('../app/renderer/assets/fonts/Unbounded800.ttf'); font-weight: 800; }
  @font-face { font-family: 'Hanken Grotesk'; src: url('../app/renderer/assets/fonts/HankenGrotesk-latin.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('../app/renderer/assets/fonts/JetBrainsMono500.ttf'); font-weight: 500; }
  :root {
    --acc: 229, 56, 74; --acc-hi: 255, 142, 154; --acc-lo: 122, 13, 28;
    --night: #09080A; --bone: #F4ECEC; --haze: #a8939a; --muted: #7d6a6e;
    --line: rgba(255, 235, 238, .10); --line-strong: rgba(255, 235, 238, .18);
    --glass-bg: linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.02) 40%, rgba(255,255,255,.035)), rgba(14,10,12,.55);
    --glass-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 -1px 0 rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.45);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--night); color: var(--bone); font: 400 14px/1.55 'Hanken Grotesk', 'Segoe UI', sans-serif; overflow: hidden; }
  body::before, body::after { content: ''; position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 0; }
  body::before { width: 720px; height: 560px; left: -220px; top: -260px; background: rgba(var(--acc-lo), .55); }
  body::after { width: 680px; height: 520px; right: -240px; bottom: -280px; background: rgba(var(--acc-lo), .45); }
  main { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; gap: 16px; padding: 20px; }
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; }
  h1 { font: 800 20px 'Unbounded', sans-serif; letter-spacing: .04em; margin: 0; }
  h1 b { color: rgb(var(--acc)); }
  h2 { font: 800 12px 'Unbounded', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--haze); margin: 0 0 12px; }
  .pill { font-size: 12px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line-strong); color: var(--haze); }
  .pill.ok { color: #9fe0b0; border-color: rgba(159,224,176,.4); }
  .pill.ko { color: rgb(var(--acc-hi)); border-color: rgba(var(--acc),.6); }
  .col { display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow: auto; }
  .card { background: var(--glass-bg); box-shadow: var(--glass-shadow); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  button { font: 600 13px 'Hanken Grotesk', sans-serif; color: var(--bone); background: rgba(255,255,255,.04); border: 1px solid var(--line-strong);
    border-radius: 12px; padding: 12px 14px; cursor: pointer; text-align: left; transition: background .15s, border-color .15s; }
  button small { display: block; font-weight: 400; color: var(--muted); margin-top: 2px; }
  button:hover { background: rgba(255,255,255,.08); border-color: rgba(var(--acc-hi), .4); }
  button.lit { background: linear-gradient(180deg, rgba(var(--acc),.55), rgba(var(--acc-lo),.55)); box-shadow: 0 0 0 1px rgba(var(--acc-hi),.55) inset, 0 6px 22px rgba(var(--acc),.35); border-color: transparent; }
  button:disabled { opacity: .45; cursor: wait; }
  #files { max-height: 180px; overflow: auto; margin: 0 0 10px; font: 500 12px 'JetBrains Mono', monospace; }
  #files label { display: flex; gap: 8px; padding: 3px 0; color: var(--haze); cursor: pointer; }
  #files label span { color: rgb(var(--acc-hi)); width: 22px; }
  input[type=text] { width: 100%; font: inherit; color: var(--bone); background: rgba(0,0,0,.32); border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .row { display: flex; gap: 10px; }
  .row button { flex: 1; text-align: center; }
  #log { flex: 1; min-height: 200px; margin: 0; overflow: auto; white-space: pre-wrap; font: 500 12px/1.5 'JetBrains Mono', monospace; color: #d9c6c9;
    background: rgba(0,0,0,.4); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .logcard { display: flex; flex-direction: column; min-height: 0; flex: 1; }
</style>
</head>
<body>
<main>
  <header>
    <h1>ONIRIQUE <b>FONDATEURS</b></h1>
    <span class="pill" id="h-site">Site…</span>
    <span class="pill" id="h-api">API…</span>
  </header>

  <div class="col">
    <section class="card">
      <h2>Le site</h2>
      <div class="grid">
        <button data-open="admin" class="lit">Panel admin<small>Comptes, plugins, codes, mails, support</small></button>
        <button data-open="site">Ouvrir le site<small>onirique.store</small></button>
        <button data-open="boutique">Ouvrir la boutique</button>
        <button id="recheck">Vérifier que tout répond</button>
      </div>
    </section>

    <section class="card">
      <h2>Mon travail</h2>
      <div class="grid" style="margin-bottom:12px">
        <button data-act="pull">Récupérer le travail de l'équipe<small>git pull</small></button>
        <button id="refresh">Voir mes changements</button>
      </div>
      <div id="files"></div>
      <input type="text" id="msg" placeholder="Ce qui a changé, en une phrase">
      <div class="row"><button id="commit">Enregistrer les fichiers cochés</button></div>
    </section>

    <section class="card">
      <h2>Mettre en ligne</h2>
      <div class="grid">
        <button data-act="deploy" class="lit" data-confirm="Mettre en ligne le site et le serveur (dernier enregistrement) ?">Mettre en ligne<small>Site et serveur</small></button>
        <button data-act="releaseApp" data-confirm="Publier une nouvelle version de l'application ONIRIQUE CENTRAL ?">Publier l'application<small>Version suivante, Windows</small></button>
        <button data-act="releaseNav" data-confirm="Publier une nouvelle version du navigateur ?">Publier le navigateur<small>Version suivante, Windows</small></button>
      </div>
    </section>

    <section class="card">
      <h2>Serveur</h2>
      <div class="grid">
        <button data-act="status">État du serveur<small>Services, disque, mémoire</small></button>
        <button data-act="journal">Dernières mises en ligne</button>
        <button data-act="errors">Dernières erreurs</button>
        <button data-act="restart" data-confirm="Redémarrer l'API ? Les connexions en cours seront coupées quelques secondes.">Redémarrer l'API</button>
      </div>
    </section>
  </div>

  <div class="col">
    <section class="card logcard">
      <h2>Ce qui se passe</h2>
      <pre id="log">Prêt.
</pre>
    </section>
  </div>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const log = $('#log');
  const write = (t) => { log.textContent += t; log.scrollTop = log.scrollHeight; };
  oni.onLog(write);

  async function busy(fn) {
    const buttons = document.querySelectorAll('button');
    buttons.forEach((b) => (b.disabled = true));
    try { return await fn(); } finally { buttons.forEach((b) => (b.disabled = false)); }
  }

  document.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
    busy(async () => {
      write(`\n▸ ${b.firstChild.textContent.trim()}\n`);
      const r = await oni.action(b.dataset.act);
      write(r.code === 0 ? '✓ Terminé.\n' : `✗ Échec${r.code > 0 ? ` (code ${r.code})` : ''} : ${r.code < 0 ? r.out : 'voir ci-dessus.'}\n`);
      if (['pull', 'deploy', 'releaseApp', 'releaseNav'].includes(b.dataset.act)) listChanges();
    });
  }));
  document.querySelectorAll('[data-open]').forEach((b) => b.addEventListener('click', () => oni.open(b.dataset.open)));

  async function health() {
    const set = (el, ok, name) => { el.className = `pill ${ok ? 'ok' : 'ko'}`; el.textContent = `${name} ${ok ? 'en ligne' : 'ne répond pas'}`; };
    const h = await oni.health();
    set($('#h-site'), h.site, 'Site'); set($('#h-api'), h.api, 'API');
  }
  $('#recheck').addEventListener('click', health);

  async function listChanges() {
    const files = await oni.changes();
    const box = $('#files');
    box.replaceChildren(...files.map((f) => {
      const l = document.createElement('label');
      const c = document.createElement('input'); c.type = 'checkbox'; c.value = f.file;
      const s = document.createElement('span'); s.textContent = f.state;
      l.append(c, s, document.createTextNode(f.file));
      return l;
    }));
    if (!files.length) box.textContent = 'Aucun changement.';
  }
  $('#refresh').addEventListener('click', listChanges);
  $('#commit').addEventListener('click', () => busy(async () => {
    const files = [...document.querySelectorAll('#files input:checked')].map((c) => c.value);
    write('\n▸ Enregistrer\n');
    const r = await oni.commit(files, $('#msg').value);
    write(r.code === 0 ? '✓ Enregistré.\n' : `✗ ${r.code < 0 ? r.out : 'Échec, voir ci-dessus.'}\n`);
    if (r.code === 0) $('#msg').value = '';
    listChanges();
  }));

  health(); listChanges();
  setInterval(health, 60_000);
</script>
</body>
</html>
