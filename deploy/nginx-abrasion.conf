# Le site d'ABRASION sur sa propre origine (abrasion.onirique.store) : ses scripts n'ont pas accès à la session
# des visiteurs d'onirique.store (gardée dans le stockage du navigateur, propre à chaque origine).
# Posé par onirique-abrasion-domaine ; les pages restent dans site/abrasion/ du dépôt, à leurs adresses /abrasion/…
server {
    server_name abrasion.onirique.store;
    root /var/www/site;
    charset utf-8;
    charset_types text/plain text/css application/xml text/xml;
    index index.html;
    gzip on;
    gzip_proxied any;
    gzip_min_length 1k;
    gzip_types application/json text/css application/javascript text/javascript image/svg+xml text/plain application/xml;

    location = / { return 302 /abrasion/; }
    location /abrasion/ { include snippets/onirique-securite.conf; add_header Cache-Control "no-cache"; try_files $uri $uri.html $uri/ =404; error_page 404 /abrasion/404.html; }
    # Ce que ses pages prennent au site ONIRIQUE : scripts communs et textes légaux (lus sur place).
    location /assets/ { include snippets/onirique-securite.conf; add_header Cache-Control $onirique_asset_cache; }
    location ~ ^/(cgv|mentions-legales|confidentialite|cookies|remboursement)$ { include snippets/onirique-securite.conf; add_header Cache-Control "no-cache"; try_files $uri.html =404; }
    # Le compte, les licences et le support : le même CENTRAL, une session propre à cette origine.
    location /api/ {
        proxy_pass http://127.0.0.1:4850;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Tout le reste (accueil ONIRIQUE, boutique, téléchargements) : sur onirique.store.
    location / { return 301 https://onirique.store$request_uri; }

    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/abrasion.onirique.store/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abrasion.onirique.store/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    server_name abrasion.onirique.store;
    return 301 https://$host$request_uri;
}
