<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<script src="assets/i18n.js?v=25e3ff48"></script>
<script src="assets/ui.js?v=4"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONIRIQUE — Marketplace</title>
<meta name="description" content="Un article de la marketplace ONIRIQUE : pochette, visuel ou pack de prods d'un membre.">
<link rel="icon" type="image/png" href="assets/favicon.png?v=2">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/marketplace.css?v=1">
<link rel="stylesheet" href="/assets/da.css?v=7">
<script src="/assets/accent.js?v=1"></script>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img src="assets/logo-small.png" alt="Logo Onirique" width="160" height="145">ONIRIQUE</a>
    <nav class="nav"><a class="btn btn-ghost small" href="marketplace">Marketplace</a><a class="btn btn-ghost small opt" href="vitrine">Vitrine</a><a class="btn btn-ghost small opt" href="compte">Mon compte</a></nav>
  </div>
</header>
<main class="wrap">
  <nav class="crumbs" aria-label="Fil d'Ariane"><a href="marketplace">Marketplace</a><span>/</span><a id="crumb-kind" href="marketplace"></a></nav>
  <p class="muted" id="state" role="status">Chargement…</p>
  <section class="item" id="item" hidden>
    <div class="shot" id="shot"></div>
    <div class="info glass" id="info"></div>
  </section>
  <section class="shelf" id="same-seller" hidden><header><h2>Du même vendeur</h2></header><div class="cards row"></div></section>
  <section class="shelf" id="similar" hidden><header><h2 id="similar-title">Dans le même rayon</h2><a class="muted" id="similar-all" href="marketplace">Voir tout</a></header><div class="cards row"></div></section>
</main>
<script src="assets/marketplace.js?v=1"></script>
<script>
// La fiche d'un article de la marketplace : ?v=<id> pour un visuel de la vitrine, ?p=<id> pour un pack de prods.
// L'image à gauche (copie filigranée pour un visuel), le vendeur, le prix, les détails et l'achat à droite.
const { el, euros, noSave, card, list } = Market;
const $ = (id) => document.getElementById(id);
const TOKEN = "onirique.token";
const token = sessionStorage.getItem(TOKEN) || localStorage.getItem(TOKEN);
const params = new URLSearchParams(location.search);
const type = params.get("p") ? "pack" : "visual", itemId = Number(params.get("p") || params.get("v"));
const RAYON = { visual: "Pochettes et visuels", pack: "Packs de prods" };

async function api(method, path) {
  const response = await fetch("/api" + path, { method, headers: token ? { Authorization: "Bearer " + token } : {} })
    .catch(() => { throw new Error("Serveur injoignable. Réessaie dans un instant."); });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || "Erreur " + response.status);
  return data;
}
const sellerRow = (s) => {
  const inner = [el("img", { src: s.avatar ? s.avatar + "?w=160" : "assets/favicon.png?v=2", alt: "" }), el("div", {}, el("b", { textContent: s.name }), s.handle ? el("span", { textContent: "@" + s.handle }) : null)];
  return s.handle ? el("a", { className: "seller", href: "profil?u=" + encodeURIComponent(s.handle), title: "Voir sa page" }, ...inner) : el("div", { className: "seller" }, ...inner);
};
const contact = (s) => (s.handle ? el("a", { className: "btn btn-ghost", href: token ? "messages?u=" + encodeURIComponent(s.handle) : "compte", textContent: token ? "Contacter le vendeur" : "Se connecter pour écrire au vendeur" }) : null);
const details = (pairs) => el("dl", { className: "details" }, ...pairs.filter(([, v]) => v).flatMap(([k, v]) => [el("dt", { textContent: k }), el("dd", { textContent: v })]));

function drawVisual(v) {
  const notice = el("p", { className: "notice", role: "status" });
  const go = (route) => async (e) => {
    e.target.disabled = true;
    try { location.href = (await api("POST", "/vitrine/" + v.id + route)).url; } catch (err) { notice.textContent = err.message; e.target.disabled = false; }
  };
  $("shot").replaceChildren(noSave(el("img", { src: v.image, alt: v.title, width: v.width, height: v.height })));
  $("info").replaceChildren(...[
    el("span", { className: "eyebrow", textContent: "Visuel · " + (v.unique ? "pièce unique" : "plusieurs ventes possibles") }),
    el("h1", { textContent: v.title }),
    sellerRow(v.author),
    el("div", { className: "big-price", textContent: v.sold ? "Vendu" : v.price ? euros(v.price) : "Sur demande" }),
    el("div", { className: "actions" },
      v.forSale ? el("button", { className: "btn btn-primary", type: "button", textContent: "Acheter " + euros(v.price), onclick: go("/buy") }) : null,
      contact(v.author),
      v.simulate ? el("button", { className: "btn btn-ghost small", type: "button", textContent: "Simuler l'achat (fondateurs)", onclick: go("/simulate") }) : null),
    notice,
    v.description ? el("p", { className: "desc", textContent: v.description }) : null,
    details([["Format", v.format], ["Dimensions", v.width + " × " + v.height + " px"], ["Livraison", "Fichier original, sans filigrane"], ["Publié le", new Date(v.createdAt).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" })]]),
    v.forSale ? el("p", { className: "note", textContent: "Paiement par carte (Stripe). L'original est livré tout de suite après, sur la page de ta commande et par e-mail. L'image affichée ici est une copie réduite et filigranée." })
      : !v.sold ? el("p", { className: "note", textContent: "Pas en vente directe : écris au graphiste pour l'acheter ou pour une version sur mesure." }) : null,
  ].filter(Boolean));
  return { title: v.title, seller: v.author };
}
function drawPack(p) {
  $("shot").replaceChildren(p.image ? el("img", { src: p.image, alt: p.title }) : el("div", { className: "ph" }));
  $("info").replaceChildren(...[
    el("span", { className: "eyebrow", textContent: "Pack de prods" }),
    el("h1", { textContent: p.title }),
    sellerRow(p.seller),
    el("div", { className: "big-price" }, el("small", { textContent: "dès" }), euros(p.price)),
    el("div", { className: "actions" }, el("a", { className: "btn btn-primary", href: p.url, textContent: "Écouter et choisir une licence" }), contact(p.seller)),
    details([["Prods", p.tracks + " dans le pack"], ["En vente", p.forSale + " prod" + (p.forSale > 1 ? "s" : "")], ["Licences", "MP3, WAV, stems ou exclusive, selon la prod"]]),
    el("ul", { className: "prods" }, ...p.list.map((t) => el("li", {}, el("span", { textContent: t.title }),
      el("small", { textContent: [t.bpm && t.bpm + " BPM", t.key, "dès " + euros(t.from)].filter(Boolean).join(" · ") })))),
    el("p", { className: "note", textContent: "Chaque prod s'écoute en entier sur la page du pack ; tu choisis sa licence et tu paies par carte. Fichiers et contrat de licence sont livrés tout de suite après." }),
  ]);
  return { title: p.title, seller: p.seller };
}

async function load() {
  $("crumb-kind").textContent = RAYON[type];
  $("crumb-kind").href = "marketplace?type=" + type;
  let shown;
  try { shown = type === "pack" ? drawPack(await api("GET", "/marketplace/packs/" + itemId)) : drawVisual(await api("GET", "/vitrine/" + itemId)); }
  catch (e) { $("state").textContent = e.message + " "; $("state").append(el("a", { href: "marketplace", textContent: "Retour à la marketplace" })); return; }
  document.title = shown.title + " — Marketplace ONIRIQUE";
  $("state").hidden = true;
  $("item").hidden = false;
  // En bas : les autres articles du vendeur, puis ceux du même rayon.
  const all = await list().catch(() => []);
  const others = all.filter((x) => !(x.type === type && x.id === itemId));
  const same = others.filter((x) => shown.seller.handle ? x.seller.handle === shown.seller.handle : x.seller.name === shown.seller.name).slice(0, 8);
  const similar = others.filter((x) => x.type === type && !same.includes(x)).slice(0, 8);
  $("same-seller").hidden = !same.length;
  $("same-seller").querySelector(".cards").replaceChildren(...same.map(card));
  $("similar").hidden = !similar.length;
  $("similar-title").textContent = RAYON[type];
  $("similar-all").href = "marketplace?type=" + type;
  $("similar").querySelector(".cards").replaceChildren(...similar.map(card));
}
load();
</script>
</html>
