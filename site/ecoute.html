<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<script src="assets/i18n.js?v=119726c5"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONIRIQUE — Écoute privée</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/fonts.css">
<style>
/* Mêmes tokens que compte.html. */
:root {
  --night: #0D0809; --blood: #5C0008; --deep: #1A080A; --deep-2: #2A0A0E; --line: rgba(255,210,214,.13);
  --mist: #F6EEEE; --haze: #A88F92; --ember: #E23444; --bone: #FFECEE;
  --glow: 0 0 6px rgba(255,255,255,.55), 0 0 22px rgba(255,190,196,.45), 0 0 48px rgba(226,52,68,.55);
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-dream: "Grenze Gotisch", Georgia, serif;
  --f-body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; min-height: 100vh; color: var(--mist); font: 400 16px/1.6 var(--f-body); -webkit-font-smoothing: antialiased;
  background: radial-gradient(120% 60% at 50% -10%, rgba(140,6,20,.8), rgba(92,0,8,.45) 36%, transparent 72%), var(--night);
  background-attachment: fixed;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; border-radius: 6px; }
.wrap { width: 100%; max-width: 760px; margin-inline: auto; padding-inline: 16px; }
header .wrap { display: flex; align-items: center; justify-content: space-between; padding-block: 18px; }
.brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font: 800 15px/1 var(--f-display); letter-spacing: .16em; }
.brand img { width: 38px; height: auto; margin-block: -10px; filter: drop-shadow(0 0 6px rgba(226,52,68,.8)); }
.eyebrow { font: 500 12px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--haze); }
.muted { color: var(--haze); }
.panel { background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 18px; padding: 22px; margin-top: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; padding: 11px 18px; border-radius: 999px; border: 0; background: var(--mist); color: var(--night); font: 600 14px/1 var(--f-body); cursor: pointer; }
input { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.42); color: var(--mist); font: 500 16px var(--f-body); min-width: 0; }
.error { color: #FF7A85; font-size: 14px; }
.error:empty { display: none; }
.hero { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; margin-top: 12px; }
.hero img { width: 140px; height: 140px; border-radius: 18px; object-fit: cover; border: 1px solid var(--line); background: linear-gradient(135deg, var(--blood), var(--deep-2)); }
.hero div { flex: 1 1 220px; min-width: 0; }
h1 { font: 800 clamp(24px, 6vw, 34px)/1.15 var(--f-display); margin: 8px 0; overflow-wrap: anywhere; }
.tracks { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 8px; }
.tracks button { width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(0,0,0,.3); color: var(--mist); font: 600 15px var(--f-body); text-align: left; cursor: pointer; }
.tracks button:hover, .tracks button.on { border-color: var(--ember); }
.tracks .n { font: 500 12px var(--f-mono); color: var(--haze); width: 20px; }
.tracks .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tracks .d { font: 500 12px var(--f-mono); color: var(--haze); }
form.pw { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
form.pw input { flex: 1 1 200px; }
footer { padding: 40px 0; text-align: center; font-size: 13px; }
</style>

<header><div class="wrap"><a class="brand" href="/"><img src="assets/logo-small.png" alt="Logo Onirique" width="160" height="145">ONIRIQUE</a><span class="eyebrow">Écoute privée</span></div></header>

<main class="wrap">
  <section class="panel" id="locked" hidden>
    <p style="margin:0">Ce lien est protégé par un mot de passe.</p>
    <form class="pw" id="pw-form">
      <input id="pw" type="password" autocomplete="off" aria-label="Mot de passe" placeholder="Mot de passe">
      <button class="btn" type="submit">Écouter</button>
    </form>
    <p class="error" id="pw-error" role="alert"></p>
  </section>
  <section class="panel" id="gone" hidden><p class="error" id="gone-text" style="margin:0"></p></section>

  <section id="room" hidden>
    <div class="hero">
      <img id="cover" alt="">
      <div>
        <div class="eyebrow" id="owner"></div>
        <h1 id="title"></h1>
        <p class="muted" style="margin:0;font-size:14px">Musique en cours, partagée avec toi seulement : merci de ne pas la diffuser. Laisse un commentaire à un moment précis du titre depuis le lecteur.</p>
      </div>
    </div>
    <ul class="tracks" id="tracks"></ul>
  </section>
</main>
<footer class="muted wrap">Partagé avec <a href="/">ONIRIQUE</a> · Mes sons</footer>

<script src="assets/sounds-player.js?v=1"></script>
<script>
const $ = (id) => document.getElementById(id);
const OP = window.OniriquePlayer;
const shareToken = new URLSearchParams(location.search).get("t") || "";
let session = null;
try { session = sessionStorage.getItem("onirique.token") || localStorage.getItem("onirique.token"); } catch {}
const PASS = "onirique.ecoute." + shareToken;
let pass = null;
try { pass = sessionStorage.getItem(PASS); } catch {}

async function api(path, body) {
  const response = await fetch("/api/sounds/share/" + encodeURIComponent(shareToken) + path, {
    method: "POST",
    headers: { "Content-Type": "application/json", ...(session ? { Authorization: "Bearer " + session } : {}) },
    body: JSON.stringify({ pass, ...body }),
  }).catch(() => { throw new Error("Serveur injoignable. Réessaie dans un instant."); });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw Object.assign(new Error(data.error || "Erreur " + response.status), { status: response.status });
  return data;
}

const player = OP.create({
  askName: !session,
  onPlay: (t) => api("/play", { trackId: t.trackId }).catch(() => {}),
  onComment: (t, at, body, name) => api("/comments", { trackId: t.trackId, at, body, name }),
});

function show(data) {
  if (data.pass) { pass = data.pass; try { sessionStorage.setItem(PASS, pass); } catch {} }
  $("locked").hidden = true;
  $("room").hidden = false;
  document.title = data.title + " — " + data.owner + " · ONIRIQUE";
  $("owner").textContent = data.owner + (data.title !== data.project ? " · " + data.project : "");
  $("title").textContent = data.title;
  if (data.cover) $("cover").src = data.cover; else $("cover").removeAttribute("src");
  const items = data.tracks.map((t) => ({ trackId: t.id, id: t.version.id, title: t.title, subtitle: data.owner, url: t.version.url,
    downloadUrl: t.version.downloadUrl, duration: t.version.duration, peaks: t.version.peaks, comments: t.comments }));
  const buttons = items.map((item, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.append(...[["n", String(i + 1)], ["t", item.title], ["d", item.duration ? OP.time(item.duration) : ""]].map(([c, text]) => Object.assign(document.createElement("span"), { className: c, textContent: text })));
    b.onclick = () => { buttons.forEach((x) => x.classList.toggle("on", x === b)); player.load(item, true); };
    return b;
  });
  $("tracks").replaceChildren(...buttons.map((b) => { const li = document.createElement("li"); li.append(b); return li; }));
  if (items.length) { buttons[0].classList.add("on"); player.load(items[0], false); }
}

async function open(password) {
  try {
    show(await api("", password ? { password } : {}));
  } catch (error) {
    if (error.status === 401) {
      pass = null;
      $("locked").hidden = false;
      $("pw-error").textContent = password ? error.message : "";
    } else {
      $("gone").hidden = false;
      $("gone-text").textContent = error.message;
    }
  }
}
$("pw-form").onsubmit = (event) => { event.preventDefault(); if ($("pw").value) open($("pw").value); };
open();
</script>
</html>
