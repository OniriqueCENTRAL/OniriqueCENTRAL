<style>
/* ONR NEURAL LEARNING, la page des fondateurs : ce que VOCALBOX apprend, en clair. Un tableau de bord par onglets (aperçu,
   à valider, modules, artistes, chaînes partagées, retours, cerveau), à lire en une minute. Tokens : da.css (Nuit & Braise). */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--night); }
body { margin: 0; min-height: 100vh; color: var(--mist); font: 400 14.5px/1.55 var(--f-body); -webkit-font-smoothing: antialiased;
  background: radial-gradient(1200px 600px at 85% -10%, rgba(var(--acc-lo), .35), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(var(--acc-lo), .22), transparent 60%), var(--night); }
a { color: var(--ember-text); }
button, input { font: inherit; color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px 24px 80px; }
header.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
header.top h1 { font: 800 26px/1.1 var(--f-display); margin: 0; letter-spacing: .02em; }
header.top h1 span { color: var(--ember-text); text-shadow: var(--glow); }
header.top p { margin: 6px 0 0; color: var(--haze); max-width: 640px; }
.ver { font: 500 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--haze); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; background: var(--glass); }

nav.tabs { position: sticky; top: 0; z-index: 3; display: flex; gap: 6px; overflow-x: auto; padding: 10px 0; margin-bottom: 18px;
  background: linear-gradient(var(--night) 70%, transparent); scrollbar-width: none; }
nav.tabs button { flex: none; border: 1px solid var(--line); background: var(--glass); box-shadow: var(--glass-shadow); border-radius: 999px; padding: 8px 15px;
  font: 500 11.5px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--label); cursor: pointer; transition: background .2s var(--ease), color .2s; }
nav.tabs button:hover { color: var(--mist); }
nav.tabs button[aria-selected="true"] { background: var(--lit); box-shadow: var(--lit-shadow); color: #fff; }
nav.tabs .n { display: inline-block; min-width: 18px; margin-left: 6px; padding: 1px 6px; border-radius: 999px; background: rgb(var(--acc)); color: #fff; font-size: 10.5px; }

.card { border: 1px solid var(--line); border-radius: 18px; background: var(--glass), rgba(18,12,14,.6); box-shadow: var(--glass-shadow); padding: 18px 20px; }
.grid { display: grid; gap: 14px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi b { display: block; font: 700 30px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.kpi span { color: var(--haze); font-size: 12.5px; }
.kpi small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 4px; }
h2 { font: 500 11.5px var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--haze); margin: 28px 0 12px; }
h3 { font: 700 15px var(--f-display); margin: 0 0 6px; letter-spacing: .01em; }
p { margin: 0 0 10px; }
.muted { color: var(--haze); }
.two { grid-template-columns: 1.3fr 1fr; }
@media (max-width: 900px) { .two { grid-template-columns: 1fr; } }

ul.facts { list-style: none; margin: 0; padding: 0; }
ul.facts li { position: relative; padding: 9px 0 9px 22px; border-bottom: 1px solid var(--line); }
ul.facts li:last-child { border-bottom: 0; }
ul.facts li::before { content: ""; position: absolute; left: 4px; top: 17px; width: 7px; height: 7px; border-radius: 50%; background: rgb(var(--acc)); box-shadow: var(--glow); }
ul.facts b { color: #fff; font-weight: 600; }

/* les barres : une seule série, braise, extrémité arrondie, valeur en texte à côté */
.bars { display: grid; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(110px, 180px) 1fr auto; gap: 12px; align-items: center; font-size: 13.5px; }
.bar-row .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { height: 10px; border-radius: 0 5px 5px 0; background: rgba(255,255,255,.05); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 0 4px 4px 0; background: linear-gradient(90deg, rgb(var(--acc-lo)), rgb(var(--acc))); min-width: 2px; }
.bar-row .val { color: var(--label); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.week { display: flex; align-items: flex-end; gap: 8px; height: 140px; padding-top: 10px; }
.week div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; cursor: default; }
.week div i { width: 100%; max-width: 44px; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, rgb(var(--acc)), rgb(var(--acc-lo))); min-height: 2px; transition: filter .15s; }
.week div:hover i { filter: brightness(1.3); }
.week small { color: var(--muted); font-size: 10.5px; font-family: var(--f-mono); }

table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: left; font: 500 10.5px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--haze); padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.click { cursor: pointer; }
tr.click:hover td { background: rgba(255,255,255,.03); }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini { display: inline-block; width: 70px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.06); vertical-align: middle; margin-right: 8px; overflow: hidden; }
.mini i { display: block; height: 100%; background: rgb(var(--acc)); border-radius: 3px; }
tr.detail td { background: rgba(0,0,0,.18); color: var(--label); font-size: 13px; }
.scroll { overflow-x: auto; }

.tag { display: inline-block; font: 500 10.5px var(--f-mono); letter-spacing: .06em; border-radius: 7px; padding: 3px 8px; margin: 0 5px 5px 0; background: rgba(var(--acc), .16); color: var(--ember-text); white-space: nowrap; }
.tag.plain { background: rgba(255,255,255,.06); color: var(--label); }
.tag.good { background: rgba(244,236,236,.12); color: #fff; }
.tag.bad { background: rgba(var(--acc-lo), .45); color: #ffb3bb; }
.chain { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chain .tag { margin: 0; }
.chain .arrow { color: var(--muted); font-size: 12px; }

.prop { border: 1px solid rgba(var(--acc-hi), .35); }
.prop .kind { font: 500 10.5px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ember-text); }
.prop .why { color: var(--haze); font-size: 12.5px; }
.acts { display: flex; gap: 8px; margin-top: 12px; }
.btn { border: 1px solid var(--line); border-radius: 11px; padding: 8px 16px; cursor: pointer; background: var(--glass); font-weight: 600; }
.btn.ok { background: var(--lit); box-shadow: var(--lit-shadow); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }

.fb { display: grid; gap: 8px; }
.fb .q { font-style: italic; color: #fff; }
.fb .meta { display: flex; flex-wrap: wrap; gap: 4px; }
.fb .tw { font-size: 13px; color: var(--label); }
input.search { width: 100%; max-width: 420px; border: 1px solid var(--line); background: var(--glass); border-radius: 999px; padding: 9px 16px; outline: none; margin-bottom: 14px; }
input.search:focus { border-color: var(--ember-text); }
.empty { color: var(--haze); padding: 18px; border: 1px dashed var(--line); border-radius: 14px; }

#gate { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: rgba(9,8,10,.75); backdrop-filter: blur(6px); z-index: 9; padding: 24px; }
#gate h1 { font: 800 24px var(--f-display); }
@media (max-width: 640px) {
  .wrap { padding: 18px 16px 60px; }
  .bar-row { grid-template-columns: 100px 1fr auto; }
  header.top h1 { font-size: 21px; }
}
</style>

<div id="gate">
  <div>
    <h1>ONR <span style="color:var(--ember-text)">Neural Learning</span></h1>
    <p class="muted" id="gateMsg">Chargement…</p>
  </div>
</div>

<div class="wrap">
  <header class="top">
    <div>
      <h1>ONR <span>Neural Learning</span></h1>
      <p>Ce que VOCALBOX apprend des gens qui ont allumé l'option : leurs mix, ce qu'ils gardent, ce qu'ils retouchent, les chaînes qu'ils partagent. Anonyme, jamais de son.</p>
    </div>
    <span class="ver" id="ver"></span>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const n = Object.assign(document.createElement(tag), props); n.append(...kids.flat(3).filter((k) => k != null && k !== false)); return n; };
const token = (() => { try { return sessionStorage.getItem("onirique.token") || localStorage.getItem("onirique.token"); } catch { return null; } })();
const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/^facon /, "").trim();
const date = (t) => new Date(t).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
const pct = (a, b) => (b ? Math.round((100 * a) / b) + " %" : "—");
const num = (v, d = 1) => (Math.round(v * 10 ** d) / 10 ** d).toLocaleString("fr-FR");
const signed = (v, d = 1) => (v > 0 ? "+" : v < 0 ? "−" : "") + num(Math.abs(v), d);
// « de » devant une voyelle : « plus d'air », « moins d'écho » ; et le pluriel : « 1 poste », « 2 postes »
const de = (w) => (/^[aeiouyhàâéèêëîïôûù]/i.test(w) ? "d'" : "de ") + w;
const postes = (n) => `${n} poste${Number(n) > 1 ? "s" : ""}`;

const HINTS = { reverb: "réverbe", delay: "delay", air: "air", bright: "brillance", comp: "compression", warm: "chaleur" };
// les réglages retouchés, ramenés aux couleurs du cerveau (comme le serveur, brainlearn.js)
const PARAM_TO_HINT = { fxReverbMix: ["reverb", 1 / 70], fxDelayMix: ["delay", 1 / 18], air: ["air", 1 / 3], high: ["bright", 1 / 1.5], parallelAmount: ["comp", 1 / 25], satWarmth: ["warm", 1 / 30] };
const PARAMS = { fetAttack: "attaque", fetRelease: "release", fetIn: "entrée", fetOut: "sortie", laPeak: "peak", laGain: "gain", mud: "DeMud", high: "HI", air: "AIR",
  fxReverbMix: "envoi", fxReverbDecay: "durée", fxDelayMix: "envoi", fxDelayFeedback: "feedback", parallelAmount: "quantité", deessAmt: "quantité", deessFreq: "fréquence",
  nsAmount: "quantité", drive: "drive", tuneRetune: "vitesse (retune)", tuneHumanize: "humanize", dbrReduction: "réduction", dclkAmount: "quantité", drvAmount: "quantité",
  cl1bThreshold: "seuil", cl1bGain: "gain", preampGain: "gain", gateThr: "seuil", plosive: "quantité", input: "niveau d'entrée",
  macroPresence: "PRÉSENCE", macroWarmth: "CHALEUR", macroHold: "TENUE", macroSpace: "ESPACE" };
const paramLabel = (id) => { const m = id.match(/^peq(\d)(Gain|Freq|Q|On)$/); return PARAMS[id] || (m ? `bande ${m[1]} ${({ Gain: "gain", Freq: "fréquence", Q: "Q", On: "on" })[m[2]]}` : id); };
const ROLES = ["LEAD", "BACKS", "ADLIBS", "DOUBLES"];
const RESULT = { kept: ["gardée telle quelle", "good"], tweaked: ["retouchée", "plain"], rebuilt: ["démontée", "bad"] };
const ENDED = { newmix: "nouveau mix demandé", remix: "autre voix essayée", community: "chaîne de la communauté essayée", usual: "chaîne habituelle montée" };

let D = null, tab = "apercu";

//------------------------------------------------------------------------------ Les données
async function load() {
  if (!token) return gate("Connecte-toi avec ton compte fondateur pour ouvrir cette page.", true);
  let r;
  try { r = await fetch("/api/vocalbox/founders", { headers: { Authorization: "Bearer " + token } }); } catch { return gate("Le serveur ne répond pas."); }
  if (r.status === 401) return gate("Session expirée : reconnecte-toi.", true);
  if (r.status === 403) return gate("Cette page est réservée aux fondateurs.");
  if (!r.ok) return gate("Erreur du serveur (" + r.status + ").");
  D = await r.json();
  D.chains ||= [];
  $("gate").hidden = true;
  compute();
  render();
}
function gate(msg, login) {
  const m = $("gateMsg"); m.textContent = msg;
  if (login) m.append(" ", el("a", { href: "compte", textContent: "Se connecter" }));
}

//------------------------------------------------------------------------------ Les calculs (une fois)
let S = {};
function moduleOfParam(f, id) {
  // un réglage retouché → le module de la chaîne d'AUTO MIX qui le porte (exemplaire 1 : l'identifiant tel quel ; sinon _2, _3)
  const base = id.replace(/_\d+$/, ""), inst = id === base ? 0 : Number(id.slice(base.length + 1)) - 1;
  for (const m of f.plan?.modules || []) if ((m.instance || 0) === inst && m.params && base in m.params) return { m, base, before: m.params[base] };
  return null;
}
function compute() {
  const fb = D.feedback || [];
  const mod = new Map();
  const M = (t) => { if (!mod.has(t)) mod.set(t, { type: t, placed: 0, judged: 0, removed: 0, tweakedMixes: 0, addedAfter: 0, inChains: 0, params: new Map() }); return mod.get(t); };
  const art = new Map();
  const A = (name) => { const k = norm(name); if (!art.has(k)) art.set(k, { name: String(name).replace(/^fa[cç]on /i, ""), n: 0, yes: 0, no: 0, judged: 0, kept: 0, rebuilt: 0, hints: {}, refs: 0, installs: new Set() }); return art.get(k); };
  const tweaks = new Map(), words = new Map(), weeks = new Map();
  let judged = 0, kept = 0, rebuilt = 0, yes = 0, no = 0, compares = 0;
  for (const f of fb) {
    const out = f.extra?.outcome;
    if (f.rating > 0) yes++; else if (f.rating < 0) no++;
    if (out) { judged++; if (out.result === "kept") kept++; if (out.result === "rebuilt") rebuilt++; if ((out.compares || 0) >= 1) compares++; }
    const removed = new Set(out?.removedModules || []);
    for (const m of f.plan?.modules || []) { const s = M(m.type); s.placed++; if (out) { s.judged++; if (removed.has(m.type)) s.removed++; } }
    for (const t of out?.addedModules || []) M(t).addedAfter++;
    const touched = new Set();
    for (const [id, v] of Object.entries(f.final || {})) {
      const hit = moduleOfParam(f, id);
      const label = hit ? hit.m.type + " · " + paramLabel(hit.base) : paramLabel(id.replace(/_\d+$/, ""));
      const d = hit && Number.isFinite(Number(hit.before)) ? Number(v) - Number(hit.before) : null;
      const t = tweaks.get(label) || { n: 0, sum: 0, k: 0 }; t.n++; if (d != null) { t.sum += d; t.k++; } tweaks.set(label, t);
      if (hit) {
        touched.add(hit.m.type);
        const p = M(hit.m.type).params; const q = p.get(hit.base) || { n: 0, sum: 0 }; q.n++; if (d != null) q.sum += d; p.set(hit.base, q);
      }
    }
    for (const t of touched) M(t).tweakedMixes++;
    for (const w of f.extra?.refine || []) { const k = String(w).toLowerCase().trim(); if (k) words.set(k, (words.get(k) || 0) + 1); }
    // les artistes : notes, gestes, et la correction moyenne en couleurs
    const planned = {};
    for (const m of f.plan?.modules || []) if (!m.instance) Object.assign(planned, m.params || {});
    const deltas = {};
    for (const [id, v] of Object.entries(f.final || {})) { const map = PARAM_TO_HINT[id]; if (map && planned[id] != null) deltas[map[0]] = (deltas[map[0]] || 0) + (Number(v) - Number(planned[id])) * map[1]; }
    for (const a of f.artists || []) {
      const s = A(a); s.n++; s.installs.add(f.install);
      if (f.rating > 0) s.yes++; else if (f.rating < 0) s.no++;
      if (out) { s.judged++; if (out.result === "kept") s.kept++; if (out.result === "rebuilt") s.rebuilt++; }
      if (f.extra?.refProfile) s.refs++;
      for (const [k, d] of Object.entries(deltas)) { s.hints[k] ||= []; s.hints[k].push(d); }
    }
    const w = Math.floor(f.at / (7 * 864e5)); const x = weeks.get(w) || { n: 0, yes: 0, rated: 0 }; x.n++; if (f.rating) { x.rated++; if (f.rating > 0) x.yes++; } weeks.set(w, x);
  }
  for (const c of D.chains) { const seen = new Set(); for (const m of c.modules || []) if (!seen.has(m.type)) { seen.add(m.type); M(m.type).inChains++; } }
  S = { fb, mod: [...mod.values()].sort((a, b) => b.placed + b.inChains - (a.placed + a.inChains)), art: [...art.values()].sort((a, b) => b.n - a.n),
    tweaks: [...tweaks.entries()].sort((a, b) => b[1].n - a[1].n), words: [...words.entries()].sort((a, b) => b[1] - a[1]),
    weeks: [...weeks.entries()].sort((a, b) => a[0] - b[0]).slice(-10), judged, kept, rebuilt, yes, no, compares,
    pending: (D.proposals || []).filter((p) => p.status === "pending") };
}

//------------------------------------------------------------------------------ L'affichage
const TABS = [["apercu", "Aperçu"], ["valider", "À valider"], ["modules", "Modules"], ["artistes", "Artistes"], ["chaines", "Chaînes"], ["retours", "Retours"], ["cerveau", "Le cerveau"]];
function render() {
  const sh = D.shipped || {};
  $("ver").textContent = `Cerveau v${sh.version || 0}.${sh.revision || 0} · ${postes(D.installs || 0)}`;
  const nav = $("tabs"); nav.replaceChildren();
  for (const [id, label] of TABS) {
    const b = el("button", { role: "tab", type: "button", textContent: label, onclick: () => { tab = id; render(); scrollTo({ top: 0 }); } });
    b.setAttribute("aria-selected", String(tab === id));
    if (id === "valider" && S.pending.length) b.append(el("span", { className: "n", textContent: S.pending.length }));
    nav.append(b);
  }
  const v = $("view"); v.replaceChildren();
  ({ apercu, valider, modules, artistes, chaines, retours, cerveau })[tab](v);
}
const bars = (rows, fmt = (x) => x) => {
  const max = Math.max(1, ...rows.map((r) => r[1]));
  return el("div", { className: "bars" }, rows.map(([lab, n, title]) => el("div", { className: "bar-row", title: title || `${lab} : ${fmt(n)}` },
    el("span", { className: "lab", textContent: lab }), el("div", { className: "track" }, el("i", { style: `width:${(100 * n) / max}%` })), el("span", { className: "val", textContent: fmt(n) }))));
};
const kpi = (value, label, note) => el("div", { className: "card kpi" }, el("b", { textContent: value }), el("span", { textContent: label }), note ? el("small", { textContent: note }) : null);
const empty = (t) => el("p", { className: "empty", textContent: t });
const mini = (share) => el("span", { className: "mini" }, el("i", { style: `width:${Math.round(share * 100)}%` }));

function apercu(v) {
  const fb = S.fb, rated = S.yes + S.no;
  v.append(el("div", { className: "grid kpis" },
    kpi(fb.length, "mix reçus", `${postes(D.installs || 0)} différent${(D.installs || 0) > 1 ? "s" : ""}`),
    kpi(pct(S.yes, rated), "de mix notés OUI", `${S.yes} OUI · ${S.no} BOF · ${fb.length - rated} sans note`),
    kpi(pct(S.kept, S.judged), "gardés tels quels", S.judged ? `${S.rebuilt} chaînes démontées sur ${S.judged}` : "arrive avec la nouvelle version"),
    kpi(D.chains.filter((c) => c.source !== "manual" && c.name && !c.hidden).length, "chaînes dans la bibliothèque", `${D.chains.filter((c) => c.source === "manual").length} construites à la main`),
    kpi(S.pending.length, "à valider", S.pending.length ? "voir l'onglet À valider" : "rien en attente")));

  // ce qu'il faut retenir, en phrases
  const facts = [];
  const topArt = S.art[0];
  if (topArt) facts.push(el("li", {}, "L'artiste le plus demandé : ", el("b", { textContent: topArt.name }), ` (${topArt.n} mix, ${pct(topArt.yes, topArt.yes + topArt.no)} de OUI).`));
  const removedMost = S.mod.filter((m) => m.judged >= 5).sort((a, b) => b.removed / b.judged - a.removed / a.judged)[0];
  if (removedMost && removedMost.removed) facts.push(el("li", {}, "Le module le plus retiré après AUTO MIX : ", el("b", { textContent: removedMost.type }), ` (${pct(removedMost.removed, removedMost.judged)} des fois où il est mis).`));
  const tw = S.tweaks.find(([, t]) => t.k >= 3);
  if (tw) facts.push(el("li", {}, "Le réglage le plus retouché : ", el("b", { textContent: tw[0] }), ` (${tw[1].n} mix), en général ${tw[1].sum / tw[1].k > 0 ? "monté" : "baissé"} de ${num(Math.abs(tw[1].sum / tw[1].k))}.`));
  if (S.words[0]) facts.push(el("li", {}, "Ce que les gens demandent le plus en mots : ", el("b", { textContent: "« " + S.words[0][0] + " »" }), ` (${S.words[0][1]} fois).`));
  const addedMost = [...S.mod].sort((a, b) => b.addedAfter + b.inChains - (a.addedAfter + a.inChains))[0];
  if (addedMost && addedMost.addedAfter + addedMost.inChains) facts.push(el("li", {}, "Le module que les gens ajoutent le plus eux-mêmes : ", el("b", { textContent: addedMost.type }), "."));
  if (S.judged) facts.push(el("li", {}, el("b", { textContent: pct(S.compares, S.judged) }), " des mix sont comparés avant / après avec COMPARER."));
