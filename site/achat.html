<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<script src="assets/i18n.js?v=84dd6992"></script>
<script src="assets/ui.js?v=2"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONIRIQUE — Ton achat</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/fonts.css">
<style>
/* Mêmes tokens que ecoute.html. */
:root {
  --night: #0D0809; --blood: #5C0008; --deep: #1A080A; --line: rgba(255,210,214,.13);
  --mist: #F6EEEE; --haze: #A88F92; --ember: #E23444;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; color: var(--mist); font: 400 16px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; background: var(--night); }
body::before { content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background: radial-gradient(120% 60% at 50% -10%, rgba(140,6,20,.8), rgba(92,0,8,.45) 36%, transparent 72%); }
a { color: inherit; }
.wrap { width: 100%; max-width: 720px; margin-inline: auto; padding-inline: 16px; }
header .wrap { display: flex; align-items: center; justify-content: space-between; padding-block: 18px; }
.brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font: 800 15px/1 var(--f-display); letter-spacing: .16em; }
.brand img { width: 38px; height: auto; margin-block: -10px; filter: drop-shadow(0 0 6px rgba(226,52,68,.8)); }
.eyebrow { font: 500 12px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--haze); }
.muted { color: var(--haze); }
main { padding-block: 24px 80px; }
.panel { background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 22px; padding: clamp(18px, 4vw, 28px); }
h1 { font: 800 clamp(22px, 5vw, 30px)/1.15 var(--f-display); margin: 10px 0 6px; overflow-wrap: anywhere; }
.status { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line); font: 600 13px var(--f-body); }
.status.paid { background: var(--ember); border-color: var(--ember); color: var(--night); }
.files { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 10px; }
.files a, .files span { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); text-decoration: none; font-weight: 600; }
.files a:hover { border-color: var(--ember); }
.files a::after { content: "Télécharger"; font: 600 13px var(--f-body); color: var(--ember); }
pre { white-space: pre-wrap; margin: 12px 0 0; padding: 16px; border-radius: 14px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,210,214,.07); font: 400 13px/1.6 var(--f-mono); color: var(--haze); }
.error { color: #FF7A85; }
</style>
<body>
<header><div class="wrap"><a class="brand" href="/"><img src="assets/logo-small.png" alt="Logo Onirique" width="160" height="145">ONIRIQUE</a><span class="eyebrow">Ton achat</span></div></header>
<main class="wrap">
  <section class="panel" id="order" aria-live="polite"><p class="muted" style="margin:0">Chargement de ta commande…</p></section>
</main>
<script>
// La page d'achat d'une prod : l'état de la commande, puis ses fichiers et son contrat de licence une fois le paiement
// confirmé par le prestataire. Tant qu'il ne l'est pas, la page revient demander toutes les trois secondes.
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children.filter((c) => c !== null && c !== undefined && c !== false && c !== ""));
  return node;
};
const euros = (cents) => (cents / 100).toLocaleString("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: cents % 100 ? 2 : 0 });
const token = new URLSearchParams(location.search).get("o") || "";
let tries = 0;

async function load() {
  let o;
  try {
    const response = await fetch("/api/sounds/orders/" + encodeURIComponent(token), { cache: "no-store" });
    o = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(o.error || "Commande introuvable.");
  } catch (error) {
    $("order").replaceChildren(el("p", { className: "error", style: "margin:0", textContent: error.message }));
    return;
  }
  const paid = o.status === "paid";
  $("order").replaceChildren(
    el("div", { className: "eyebrow", textContent: "Commande n° " + o.number + (o.sandbox ? " · paiement de test" : "") }),
    el("h1", { textContent: o.trackTitle }),
    el("p", { className: "muted", style: "margin:0 0 12px", textContent: o.artist + " · licence " + o.license.name + " · " + euros(o.amount) }),
    el("span", { className: "status" + (paid ? " paid" : ""), textContent: paid ? "Paiement confirmé" : "Paiement en cours de confirmation…" }),
    paid ? el("ul", { className: "files" }, ...o.files.map((f) => el("li", {}, f.available
      ? el("a", { href: f.url, download: "", textContent: f.label })
      : el("span", { className: "muted", textContent: f.label + " : plus disponible, écris au beatmaker" }))),
      el("li", {}, el("a", { href: o.contractUrl, download: "", textContent: "Contrat de licence (texte)" })))
      : el("p", { className: "muted", textContent: tries > 40 ? "La confirmation prend plus de temps que prévu. Tu recevras un e-mail dès qu'elle arrive ; tu peux garder cette page ouverte."
        : "Dès que le paiement est confirmé, tes fichiers apparaissent ici et un e-mail t'est envoyé." }),
    paid && o.buyerEmail ? el("p", { className: "muted", style: "font-size:14px", textContent: "Le lien de cette page a aussi été envoyé à " + o.buyerEmail + ". Garde-le : il reste valable." }) : "",
    paid ? el("pre", { textContent: o.contract }) : "");
  if (!paid && tries++ < 200) setTimeout(load, 3000);
}
load();
</script>
</html>
