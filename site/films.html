<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Films — ONIRIQUE</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/pages.css">
<link rel="stylesheet" href="assets/tools.css">

<header>
  <div class="wrap">
    <a class="brand" href="/"><img src="assets/logo-small.png" alt="Logo Onirique" width="160" height="145">ONIRIQUE</a>
  </div>
</header>
<main class="wrap">
  <section class="hero">
    <p class="eyebrow">Fondateurs</p>
    <h1><em>Films</em></h1>
    <p class="lede" id="state" aria-live="polite">Chargement…</p>
  </section>
</main>

<script>
// La page elle-même vient de l'API, qui ne la donne qu'à un compte fondateur.
(async () => {
  const state = document.getElementById("state");
  let token = null;
  try { token = sessionStorage.getItem("onirique.token") || localStorage.getItem("onirique.token"); } catch {}
  if (!token) { state.innerHTML = 'Page réservée aux fondateurs : <a href="compte">connecte-toi à ton compte</a>.'; return; }
  try {
    const response = await fetch("/api/films/page", { headers: { Authorization: "Bearer " + token } });
    if (response.status === 401) { state.innerHTML = 'Session expirée : <a href="compte">reconnecte-toi</a>.'; return; }
    if (!response.ok) { state.textContent = response.status === 403 ? "Page réservée aux fondateurs." : "La page n'a pas pu être chargée, réessaie dans un instant."; return; }
    const html = await response.text();
    document.open(); document.write(html); document.close();
  } catch { state.textContent = "Serveur injoignable. Réessaie dans un instant."; }
})();
</script>
</html>
