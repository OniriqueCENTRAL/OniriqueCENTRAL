<style>
/* Mêmes tokens que compte.html. */
:root {
  --night: #0D0809; --blood: #5C0008; --deep: #1A080A; --deep-2: #2A0A0E; --line: rgba(255,210,214,.13);
  --mist: #F6EEEE; --haze: #A88F92; --ember: #E23444; --bone: #FFECEE;
  --glow: 0 0 6px rgba(255,255,255,.55), 0 0 22px rgba(255,190,196,.45), 0 0 48px rgba(226,52,68,.55);
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-dream: "Grenze Gotisch", Georgia, serif;
  --f-body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --card: rgba(26,8,10,.72);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; min-height: 100vh; color: var(--mist); font: 400 16px/1.6 var(--f-body); -webkit-font-smoothing: antialiased;
  background: radial-gradient(120% 60% at 50% -10%, var(--glow-1, rgba(140,6,20,.8)), var(--glow-2, rgba(92,0,8,.45)) 36%, transparent 72%), var(--night);
  background-attachment: fixed;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; border-radius: 6px; }
.wrap { width: 100%; max-width: 1180px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 40px); }
header { border-bottom: 1px solid var(--line); background: rgba(13,8,9,.6); backdrop-filter: blur(14px); }
header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 16px; }
.brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font: 800 17px/1 var(--f-display); letter-spacing: .16em; }
.brand img { width: 44px; height: auto; margin-block: -12px; filter: drop-shadow(0 0 6px rgba(226,52,68,.8)); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
main { padding-block: clamp(24px, 5vw, 48px) 160px; }
h1 { font: 800 clamp(26px, 5vw, 38px)/1.1 var(--f-display); margin: 12px 0 6px; overflow-wrap: anywhere; }
h1 em { font: 600 1.3em/.8 var(--f-dream); font-style: normal; text-shadow: var(--glow); }
.eyebrow { font: 500 12px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--haze); display: flex; align-items: center; gap: 10px; }
.eyebrow::before { content: ""; flex: none; width: 13px; height: 13px; background: var(--mist); clip-path: polygon(50% 0, 56% 44%, 100% 50%, 56% 56%, 50% 100%, 44% 56%, 0 50%, 44% 44%); filter: drop-shadow(0 0 4px var(--ember)); }
.muted { color: var(--haze); }
.error { color: #FF7A85; font-size: 14px; }
.error:empty { display: none; }
.panel { background: rgba(0,0,0,.35); border: 1px solid var(--line); border-radius: 18px; padding: 24px; margin-top: 16px; }
.gate { text-align: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 999px; border: 1px solid transparent; font: 600 14px/1 var(--f-body); text-decoration: none; cursor: pointer; }
.btn-primary { background: var(--mist); color: var(--night); box-shadow: 0 10px 40px -10px rgba(226,52,68,.6); }
.btn-ghost { background: rgba(255,255,255,.03); color: var(--mist); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--ember); }
.btn:disabled { opacity: .5; cursor: default; }
.round { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--mist); cursor: pointer; }
.round:hover { border-color: var(--ember); }
.round.white { background: var(--mist); color: var(--night); border-color: var(--mist); border-radius: 50%; width: 52px; height: 52px; box-shadow: 0 10px 40px -10px var(--ember); }
input, select, textarea { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.42); color: var(--mist); font: 500 16px var(--f-body); min-width: 0; }
textarea { padding: 12px 14px; min-height: 110px; resize: vertical; line-height: 1.5; }
.cover-ph { background: radial-gradient(80% 80% at 30% 20%, rgba(226,52,68,.5), transparent 60%), linear-gradient(135deg, var(--blood), var(--deep-2)); display: grid; place-items: center; color: rgba(255,236,238,.55); }

/* La grille des projets */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.quota { min-width: 200px; font: 500 12px var(--f-mono); color: var(--haze); }
.quota i { display: block; height: 4px; margin-top: 8px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
.quota i b { display: block; height: 100%; background: var(--ember); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 28px 22px; margin-top: 32px; }
.tile { min-width: 0; }
.tile .art { position: relative; aspect-ratio: 1; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); cursor: pointer; display: block; width: 100%; padding: 0; background: none; }
.tile .art img, .tile .art .cover-ph { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
.tile .art:hover img { transform: scale(1.04); }
.tile .art .cover-ph svg { width: 38%; height: 38%; }
.tile .fab-play { position: absolute; right: 10px; bottom: 10px; width: 42px; height: 42px; border-radius: 50%; border: 0; display: grid; place-items: center; background: rgba(13,8,9,.82); color: var(--mist); backdrop-filter: blur(6px); cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
.tile .fab-play:hover { background: var(--ember); }
.tile .caption { display: flex; gap: 6px; align-items: flex-start; margin-top: 10px; }
.tile .caption div { flex: 1; min-width: 0; line-height: 1.3; }
.tile .caption b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font: 700 14px var(--f-body); }
.tile .caption span { color: var(--haze); font-size: 13px; }
.dots { flex: none; width: 30px; height: 26px; display: grid; place-items: center; border: 0; border-radius: 8px; background: none; color: var(--haze); cursor: pointer; }
.dots:hover { color: var(--mist); background: rgba(255,255,255,.06); }
.empty { text-align: center; padding: 60px 20px; }
.empty .star { width: 40px; height: 40px; margin: 0 auto 14px; color: var(--mist); filter: drop-shadow(0 0 10px var(--ember)); }

/* Un projet ouvert */
.crumb { display: flex; align-items: center; gap: 12px; }
.crumb small { display: block; color: var(--haze); font: 500 12px var(--f-mono); letter-spacing: .1em; }
.album { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: clamp(24px, 4vw, 48px); margin-top: 28px; align-items: start; }
@media (max-width: 820px) { .album { grid-template-columns: minmax(0, 1fr); } .album .art { max-width: 340px; } }
.album .art { position: relative; aspect-ratio: 1; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 30px 90px -24px var(--glow-1, rgba(226,52,68,.45)); cursor: pointer; padding: 0; background: none; width: 100%; }
.album .art img, .album .art .cover-ph { width: 100%; height: 100%; object-fit: cover; }
.album .art .cover-ph svg { width: 30%; height: 30%; }
.album .art .change { position: absolute; inset: auto 12px 12px auto; padding: 7px 12px; border-radius: 999px; background: rgba(13,8,9,.8); font: 600 12px var(--f-body); opacity: 0; transition: opacity .2s; }
.album .art:hover .change, .album .art:focus-visible .change { opacity: 1; }
.album-head { display: flex; gap: 14px; align-items: flex-start; }
.album-head > div { flex: 1; min-width: 0; }
.album-head h1 { margin: 0 0 4px; cursor: text; }
.album-meta { color: var(--haze); font-size: 14px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.album-meta img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
.add-bar { width: 100%; margin-top: 22px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 13px; border-radius: 14px; border: 1px dashed var(--line); background: rgba(255,255,255,.03); color: var(--mist); font: 600 14px var(--f-body); cursor: pointer; }
.add-bar:hover { border-color: var(--ember); background: rgba(226,52,68,.08); }
.progress { font: 500 12px var(--f-mono); color: var(--haze); margin-top: 10px; }
.progress:empty { display: none; }
.tracklist { list-style: none; margin: 14px 0 0; padding: 0; }
.trk { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto auto; align-items: center; gap: 10px; padding: 10px 8px 10px 4px; border-radius: 12px; cursor: pointer; }
.trk:hover { background: rgba(255,255,255,.04); }
.trk.now { background: color-mix(in srgb, var(--ember) 13%, transparent); }
.trk .num { text-align: center; font: 500 13px var(--f-mono); color: var(--haze); }
.trk.now .num { color: var(--ember); }
.trk b { display: block; font: 700 15px var(--f-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trk.now b { color: var(--bone); }
.trk small { color: var(--haze); font-size: 12px; }
.trk .len { font: 500 12px var(--f-mono); color: var(--haze); }
.trk.dragging { opacity: .35; }
.trk.drop-before { box-shadow: 0 -2px 0 var(--ember); }
.trk.drop-after { box-shadow: 0 2px 0 var(--ember); }
.drop-zone { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(13,8,9,.82); border: 2px dashed var(--ember); font: 700 20px var(--f-display); pointer-events: none; }

/* Le bouton + et son menu */
.fab { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom)); z-index: 35; display: inline-flex; align-items: center; gap: 8px; padding: 14px 26px; border-radius: 999px; border: 1px solid rgba(255,210,214,.18); background: rgba(26,8,10,.92); backdrop-filter: blur(14px); color: var(--mist); font: 700 15px var(--f-body); cursor: pointer; box-shadow: 0 16px 50px -14px rgba(0,0,0,.9), 0 0 36px -16px var(--ember); }
.fab:hover { border-color: var(--ember); }
body.has-player .fab { bottom: calc(88px + env(safe-area-inset-bottom)); }
.menu { position: fixed; z-index: 70; min-width: 220px; padding: 6px; border-radius: 16px; border: 1px solid rgba(255,210,214,.16); background: rgba(26,8,10,.97); backdrop-filter: blur(16px); box-shadow: 0 20px 60px -20px rgba(0,0,0,.95); }
.menu button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 12px; border: 0; border-radius: 10px; background: none; color: var(--mist); font: 600 14px var(--f-body); text-align: left; cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: rgba(255,255,255,.06); }
.menu button.danger { color: #FF5A68; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }

/* Les fenêtres */
dialog { padding: 0; border: 1px solid rgba(255,210,214,.16); border-radius: 24px; background: #150a0c; color: var(--mist); box-shadow: 0 40px 120px -30px rgba(0,0,0,1), 0 0 60px -30px rgba(226,52,68,.6); max-width: calc(100vw - 24px); max-height: calc(100dvh - 24px); }
dialog::backdrop { background: rgba(5,2,3,.72); backdrop-filter: blur(4px); }
.dlg-head { display: flex; align-items: center; gap: 12px; padding: 18px 18px 0; }
.dlg-head img, .dlg-head .cover-ph { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; flex: none; }
.dlg-head b { flex: 1; min-width: 0; font: 700 17px var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.x { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 10px; border: 0; background: rgba(255,255,255,.06); color: var(--mist); cursor: pointer; }
.x:hover { background: rgba(255,255,255,.12); }
.group { margin: 0; padding: 0; list-style: none; border-radius: 16px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,210,214,.07); overflow: hidden; }
.group > li + li { border-top: 1px solid rgba(255,210,214,.07); }
.item { width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 0; background: none; color: var(--mist); font: 600 15px var(--f-body); text-align: left; cursor: pointer; }
button.item:hover { background: rgba(255,255,255,.04); }
.item .op-icon { color: var(--haze); }
.item .grow { flex: 1; min-width: 0; }
.item .grow small { display: block; color: var(--haze); font: 400 12.5px var(--f-body); }
.item .state { color: var(--haze); font: 500 13px var(--f-body); }
.item.danger, .item.danger .op-icon { color: #FF5A68; }
.item.off { opacity: .45; cursor: default; }
.stack { display: grid; gap: 12px; }
.sub-title { font: 700 15px var(--f-display); margin: 6px 2px 0; }
/* Interrupteur */
.switch { position: relative; flex: none; width: 46px; height: 28px; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; min-height: 0; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: rgba(255,255,255,.12); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--mist); transition: transform .2s; }
.switch input:checked + span { background: var(--ember); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--ember); outline-offset: 2px; }

/* Détails d'un titre */
#details { width: 900px; }
.details { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: 520px; }
.details-left { padding: 18px; border-right: 1px solid rgba(255,210,214,.08); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; }
.details-left .x { align-self: flex-start; }
.details-left h2 { font: 800 20px/1.2 var(--f-display); margin: 18px 0 0; overflow-wrap: anywhere; }
.details-left .facts { font: 500 12px var(--f-mono); color: var(--haze); }
.details-left canvas { width: 100%; height: 64px; margin: 14px 0 4px; }
.details-left .file { font: 500 12px var(--f-mono); color: var(--haze); overflow-wrap: anywhere; }
.details-right { padding: 18px; display: flex; flex-direction: column; gap: 12px; overflow: auto; max-height: calc(100dvh - 40px); }
.details-right > * { flex: none; }
.details-right h3 { display: flex; align-items: center; gap: 10px; font: 800 22px var(--f-display); margin: 4px 2px 8px; }
@media (max-width: 760px) {
  .details { grid-template-columns: minmax(0, 1fr); }
  .details-left { border-right: 0; border-bottom: 1px solid rgba(255,210,214,.08); }
}
.versions li { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 14px; }
.tag { font: 600 11px var(--f-mono); padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); }
.tag.on { background: var(--ember); border-color: var(--ember); color: var(--night); }
/* L'étape d'un titre : maquette, V2…, final */
.stage { flex: none; padding: 4px 10px; border-radius: 999px; border: 1px dashed var(--line); background: none; color: var(--haze); font: 600 11px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
.stage:hover { border-color: var(--ember); color: var(--mist); }
.stage.maquette { border-style: solid; color: var(--mist); background: rgba(255,255,255,.06); }
.stage.version { border-style: solid; border-color: var(--ember); color: var(--ember); }
.stage.final { border-style: solid; border-color: var(--ember); background: var(--ember); color: var(--night); }
@media (max-width: 520px) { .trk .len { display: none; } }
.mini-btn { padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: none; color: var(--mist); font: 600 12px var(--f-body); cursor: pointer; }
.mini-btn:hover { border-color: var(--ember); }
.stat { display: flex; gap: 12px; }
.stat div { flex: 1; padding: 14px 16px; border-radius: 16px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,210,214,.07); }
.stat b { display: block; font: 800 26px var(--f-display); }
.stat span { color: var(--haze); font-size: 13px; }
.people li { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
.people img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
.comment-row { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; }
.comment-row .at { font: 600 12px var(--f-mono); color: var(--ember); background: none; border: 0; padding: 0; cursor: pointer; }
.comment-row p { margin: 0; flex: 1; }

/* Partage */
#share { width: 480px; }
.share-body { padding: 18px; display: grid; gap: 14px; }
.faces { display: flex; }
.faces img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 2px solid #150a0c; margin-left: -8px; }
.share-foot { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 14px 18px 18px; border-top: 1px solid rgba(255,210,214,.08); }
.share-foot .btn { padding: 15px; font-size: 15px; }
.inline { display: flex; gap: 8px; padding: 0 16px 14px; }
.inline input { flex: 1; min-height: 40px; }
.visibility { position: relative; }
.visibility select { width: 100%; min-height: 56px; padding-left: 50px; appearance: none; font-weight: 700; cursor: pointer; border-radius: 16px; }
.visibility .op-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.visibility::after { content: ""; position: absolute; right: 18px; top: 50%; width: 8px; height: 8px; border: solid var(--haze); border-width: 0 2px 2px 0; transform: translateY(-70%) rotate(45deg); pointer-events: none; }
#ask { width: 420px; }
#ask form { padding: 20px; display: grid; gap: 14px; }
#ask b { font: 700 17px var(--f-display); }
</style>

<header>
  <div class="wrap">
    <a class="brand" href="/"><img src="assets/logo-small.png" alt="Logo Onirique" width="160" height="145">ONIRIQUE</a>
    <div class="row"><a class="btn btn-ghost" href="compte.html">Mon compte</a><a href="compte.html" data-account data-account-manual hidden>Compte</a></div>
  </div>
</header>

<main class="wrap">
  <div class="panel gate" id="gate" hidden></div>

  <section id="grid-view" hidden>
    <div class="top">
      <div>
        <div class="eyebrow">Membres ONIRIQUE</div>
        <h1>Mes <em>sons</em></h1>
        <div class="muted" id="owner-name"></div>
      </div>
      <div class="quota" id="quota"></div>
    </div>
    <p class="error" id="disk-full"></p>
    <div class="tiles" id="tiles"></div>
    <div class="empty" id="empty" hidden>
      <div class="star" id="empty-star"></div>
      <p style="margin:0 0 6px;font:700 18px var(--f-display)">Ta musique en cours, à l'abri</p>
      <p class="muted" style="margin:0 auto;max-width:46ch">Crée un projet (un album, un EP, une session…), dépose tes sons, garde chaque version et fais-les écouter par un lien privé.</p>
    </div>
  </section>

  <section id="project-view" hidden>
    <div class="crumb">
      <button class="round" id="back" type="button" aria-label="Retour aux projets"></button>
      <div><b style="font:700 15px var(--f-display)">Projets</b><small id="crumb-owner"></small></div>
    </div>
    <div class="album">
      <button class="art" id="cover" type="button" aria-label="Changer la pochette"><span class="change">Changer la pochette</span></button>
      <div>
        <div class="album-head">
          <div>
            <h1 id="project-title" title="Renommer"></h1>

</main>

<button class="fab" id="fab" type="button" hidden></button>
<input type="file" id="files" accept="audio/*,.wav,.aif,.aiff,.flac,.mp3,.ogg,.m4a" multiple hidden>
<input type="file" id="cover-file" accept="image/png,image/jpeg,image/webp" hidden>
<div class="drop-zone" id="drop-zone" hidden>Dépose tes sons ici</div>

<dialog id="details"></dialog>
<dialog id="share"></dialog>
<dialog id="ask"><form method="dialog"><b id="ask-title"></b><input id="ask-input" maxlength="120" required><div class="row" style="justify-content:flex-end"><button class="btn btn-ghost" value="cancel" formnovalidate>Annuler</button><button class="btn btn-primary" value="ok">Valider</button></div></form></dialog>

<script src="assets/sounds-player.js?v=3"></script>
<script>
const $ = (id) => document.getElementById(id);
const TOKEN = "onirique.token";
const token = sessionStorage.getItem(TOKEN) || localStorage.getItem(TOKEN);
const OP = window.OniriquePlayer, icon = OP.icon;
const el = (tag, props = {}, ...children) => {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children.filter((c) => c !== null && c !== undefined && c !== false));
  return node;
};
const size = (n) => (!n ? "0 Mo" : n >= 1024 ** 3 ? (n / 1024 ** 3).toFixed(2).replace(".", ",") + " Go" : Math.max(0.1, n / 1024 ** 2).toFixed(1).replace(".", ",") + " Mo");
const day = (ms) => new Date(ms).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });

async function api(method, path, body) {
  const response = await fetch("/api" + path, {
    method,
    headers: { Authorization: "Bearer " + token, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  }).catch(() => { throw new Error("Serveur injoignable. Réessaie dans un instant."); });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw Object.assign(new Error(data.error || "Erreur " + response.status), { status: response.status });
  return data;
}
// Les fichiers passent par XMLHttpRequest, qui seul donne l'avancement de l'envoi.
function upload(path, file, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api" + path);
    xhr.setRequestHeader("Authorization", "Bearer " + token);
    xhr.setRequestHeader("Content-Type", file.type || "application/octet-stream");
    xhr.upload.onprogress = (event) => event.lengthComputable && onProgress(event.loaded / event.total);
    xhr.onload = () => {
      let data = {};
      try { data = JSON.parse(xhr.responseText); } catch {}
      xhr.status < 300 ? resolve(data) : reject(new Error(data.error || "Erreur " + xhr.status));
    };
    xhr.onerror = () => reject(new Error("L'envoi a été interrompu. Réessaie."));
    xhr.send(file);
  });
}

// ——— Envois ———
// Chaque fichier devient un titre du projet donné, ou la nouvelle version du titre donné.
async function sendFiles(files, p, toTrack) {
  files = [...files].filter((f) => /^audio\//.test(f.type) || /\.(wav|aiff?|flac|mp3|ogg|m4a)$/i.test(f.name));
  if (!files.length) return;
  $("error").textContent = "";
  for (const [n, f] of files.entries()) {
    const label = (files.length > 1 ? (n + 1) + "/" + files.length + " · " : "") + f.name;
    try {
      $("progress").textContent = label + " : lecture…";
      const wave = await OP.peaksOf(f);
      const query = "?filename=" + encodeURIComponent(f.name);
      const done = await upload(toTrack ? "/me/sounds/tracks/" + toTrack.id + "/versions" + query : "/me/sounds/projects/" + p.id + "/tracks" + query, f,
        (x) => { $("progress").textContent = label + " : " + Math.round(x * 100) + " %"; });
      if (wave) await api("PATCH", "/me/sounds/versions/" + (toTrack ? done.id : done.versionId), wave);
    } catch (error) { $("error").textContent = error.message; break; }
  }
  $("progress").textContent = "";
  await refresh().catch(fail);
}
// Des sons déposés hors d'un projet : un nouveau projet, nommé d'après le premier fichier.
async function newProjectWith(files) {
  const name = files[0].name.replace(/\.[a-z0-9]{2,5}$/i, "");
  const { id } = await api("POST", "/me/sounds/projects", { title: files.length > 1 ? "Nouveau projet" : name });
  await refresh();
  location.hash = "#/p/" + id;
  await sendFiles(files, project(id));
}

function drawPeaks(canvas, peaks) {
  requestAnimationFrame(() => {
    const dpr = devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w) return;
    canvas.width = w * dpr; canvas.height = h * dpr;
    const g = canvas.getContext("2d");
    g.scale(dpr, dpr);
    const bars = Math.floor(w / 3);
    g.fillStyle = "rgba(246,238,238,.5)";
    for (let i = 0; i < bars; i++) {
      const v = peaks && peaks.length ? peaks[Math.floor(i / bars * peaks.length)] : 0.1, bh = Math.max(2, v * (h - 4));
      g.fillRect(i * 3, (h - bh) / 2, 2, bh);
    }
  });
}

        el("div", {}, el("b", { textContent: String(t.listeners.length) }), el("span", { textContent: "auditeurs connectés" }))),
      t.lastPlay ? el("p", { className: "muted", style: "margin:0", textContent: "Dernière écoute le " + longDay(t.lastPlay) + "." }) : el("p", { className: "muted", style: "margin:0", textContent: "Pas encore d'écoute. Partage ce titre ou son projet pour le faire entendre." }),

// ——— Partage ———
let shareTarget = null;
function openShare(kind, id) { shareTarget = { kind, id }; renderShare(); if (!$("share").open) $("share").showModal(); }
function renderShare() {
  const { kind, id } = shareTarget;
  const found = kind === "project" ? { p: project(id) } : findTrack(id);
  const p = found.p, t = found.t;
  if (!p || (kind === "track" && !t)) { $("share").close(); return; }
  const link = linkFor(kind, id);
  const patch = (body) => api("PATCH", "/me/sounds/links/" + link.id, body).then(refresh, (e) => alert(e.message));
  const create = (then) => api("POST", "/me/sounds/links", kind === "project" ? { projectId: id } : { trackId: id }).then(async (made) => { await refresh(); if (then) then(made); }, (e) => alert(e.message));
  const copy = async (url, button) => {
    try { await navigator.clipboard.writeText(url); button.replaceChildren(icon("link"), "Lien copié"); } catch { prompt("Copie ce lien :", url); }
    setTimeout(() => button.isConnected && button.replaceChildren(icon("link"), "Copier le lien"), 1800);
  };
  const toggle = (checked, onchange, label) => {
    const input = el("input", { type: "checkbox", checked, ariaLabel: label });
    input.onchange = () => onchange(input.checked);
    return el("label", { className: "switch" }, input, el("span"));
  };
  const select = el("select", { ariaLabel: "Qui peut écouter" },
    el("option", { value: "private", textContent: "Privé : toi seulement", selected: !link }),
    el("option", { value: "public", textContent: "Toute personne qui a le lien", selected: !!link }));
  select.onchange = () => (select.value === "public" ? create() : unshare());
  const unshare = () => {
    const all = data.links.filter((l) => (kind === "project" ? l.projectId === id : l.trackId === id));
    Promise.all(all.map((l) => api("DELETE", "/me/sounds/links/" + l.id))).then(refresh, (e) => alert(e.message));
  };
  const head = el("div", { className: "dlg-head" }, coverOf(p), el("b", { textContent: kind === "project" ? p.title : t.title }),
    el("button", { className: "x", type: "button", ariaLabel: "Fermer", onclick: () => $("share").close() }, icon("close")));
  const body = el("div", { className: "share-body" }, el("div", { className: "visibility" }, icon(link ? "link" : "close"), select));
  const foot = el("div", { className: "share-foot" });
  if (link) {
    const listeners = link.listeners;
    body.append(group(item("queue", "Qui a écouté", {
      state: link.plays ? link.plays + " écoute" + (link.plays > 1 ? "s" : "") : "Personne pour l'instant",
      right: listeners.length ? el("span", { className: "faces" }, ...listeners.slice(0, 5).map((u) => el("img", { src: avatar(u), alt: u.name, title: u.name }))) : null,
    })));
    const password = el("input", { type: "text", placeholder: "Nouveau mot de passe", minLength: 4, autocomplete: "off", ariaLabel: "Mot de passe du lien" });
    const date = el("input", { type: "date", ariaLabel: "Date de fin", value: link.expiresAt ? new Date(link.expiresAt).toISOString().slice(0, 10) : "" });
    date.onchange = () => date.value && patch({ expiresAt: new Date(date.value + "T23:59:59").getTime() });
    const pwRow = el("div", { className: "inline", hidden: !link.password && !password.value }, password,
      el("button", { className: "mini-btn", type: "button", textContent: "Enregistrer", onclick: () => password.value && patch({ password: password.value }) }));
    body.append(el("div", { className: "sub-title", textContent: "Réglages" }), el("ul", { className: "group" },
      item("download", "Autoriser le téléchargement", { hint: "Toute personne qui a le lien peut télécharger le fichier original", right: toggle(link.download, (on) => patch({ download: on }), "Autoriser le téléchargement") }),
      item("star", "Compte ONIRIQUE exigé", { hint: "Seules les personnes connectées à leur compte peuvent écouter", right: toggle(link.requireAccount, (on) => patch({ requireAccount: on }), "Compte ONIRIQUE exigé") }),
      el("li", {}, el("div", { className: "item" }, icon("more"), el("span", { className: "grow" }, "Mot de passe",
        el("small", { textContent: link.password ? "Le lien demande un mot de passe" : "Demander un mot de passe pour écouter" })),
      toggle(link.password, (on) => { if (on) { pwRow.hidden = false; password.focus(); } else patch({ password: "" }); }, "Mot de passe")), pwRow),
      el("li", {}, el("div", { className: "item" }, icon("repeat"), el("span", { className: "grow" }, "Date de fin",
        el("small", { textContent: link.expiresAt ? "Le lien se ferme après le " + longDay(link.expiresAt) : "Le lien reste ouvert tant que tu ne le coupes pas" })),
      toggle(!!link.expiresAt, (on) => { if (on) { dateRow.hidden = false; date.showPicker?.(); } else patch({ expiresAt: null }); }, "Date de fin")),
      dateRow = el("div", { className: "inline", hidden: !link.expiresAt }, date))));

        && api("POST", "/me/sounds/links/" + link.id + "/reset").then(refresh, (e) => alert(e.message)) }),
      item("close", kind === "project" ? "Rendre le projet privé" : "Rendre le titre privé", { danger: true, onclick: () => confirm("Couper le lien ? Plus personne ne pourra écouter par lui.") && unshare() })));
    const copyBtn = el("button", { className: "btn btn-primary", type: "button" }, icon("link"), "Copier le lien");

    body.append(el("p", { className: "muted", style: "margin:0 4px;font-size:14px", textContent: kind === "project"
      ? "Personne d'autre que toi ne peut écouter ce projet. Crée un lien pour le faire entendre : tu pourras le protéger, le limiter dans le temps et le couper à tout moment."

    const make = el("button", { className: "btn btn-primary", type: "button" }, icon("link"), "Créer le lien et le copier");

let dateRow = null;

(async () => {
