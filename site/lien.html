<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONIRIQUE</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0809">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="/assets/fonts.css">
<style>
html, body { margin: 0; min-height: 100%; background: #0d0809; }
body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
#page { flex: 1; display: flex; flex-direction: column; }
#page > .lp { flex: 1; }
.missing { margin: auto; padding: 40px 20px; text-align: center; color: #f6eeee; font: 500 16px/1.5 'Hanken Grotesk', sans-serif; }
.missing a { color: #e23444; }
</style>
</head>
<body>
<main id="page"></main>
<!-- Chemins absolus : la page est servie à l'adresse /l/<pseudo>. -->
<script src="/assets/deeplink.js?v=1"></script>
<script src="/assets/linkpage.js?v=1"></script>
<script>
// La page de liens d'un fondateur : onirique.store/l/<pseudo> (ou lien.html?u=<pseudo>).
(async () => {
  const handle = (location.pathname.match(/^\/l\/([^/]+)/) || [])[1] || new URLSearchParams(location.search).get("u") || "";
  const root = document.getElementById("page");
  try {
    const response = await fetch("/api/links/" + encodeURIComponent(handle.toLowerCase()));
    if (!response.ok) throw new Error();
    const data = await response.json();
    document.title = (data.page.name || data.handle) + " · ONIRIQUE";
    const meta = document.querySelector('meta[name="theme-color"]');
    meta.content = data.page.theme.bg1;
    document.body.style.background = data.page.theme.bg1;
    OniriqueLinkPage.render(root, data.page, data);
  } catch {
    root.innerHTML = '<p class="missing">Cette page de liens n\'existe pas, ou plus.<br><a href="https://onirique.store">onirique.store</a></p>';
  }
})();
</script>
</body>
</html>
