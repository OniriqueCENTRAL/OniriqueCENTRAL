<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<script src="assets/i18n.js?v=25e3ff48"></script>
<script src="assets/ui.js?v=4"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONIRIQUE — Marketplace</title>
<meta name="description" content="Tout ce qui s'achète sur ONIRIQUE : pochettes d'album et visuels des graphistes, packs de prods des beatmakers.">
<link rel="canonical" href="https://onirique.store/marketplace">
<link rel="icon" type="image/png" href="assets/favicon.png?v=2">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/marketplace.css?v=1">
<link rel="stylesheet" href="/assets/da.css?v=7">
<script src="/assets/accent.js?v=1"></script>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img src="assets/logo-small.png" alt="Logo Onirique" width="160" height="145">ONIRIQUE</a>
    <nav class="nav"><a class="btn btn-ghost small" href="vitrine">Vendre un visuel</a><a class="btn btn-ghost small opt" href="cloud">Vendre des prods</a><a class="btn btn-ghost small opt" href="compte">Mon compte</a></nav>
  </div>
</header>
<main class="wrap">
  <span class="eyebrow">Acheter aux membres</span>
  <h1>Marketplace</h1>
  <p class="muted" style="margin:0;max-width:640px">Pochettes d'album et visuels des graphistes, packs de prods des beatmakers : tout ce qui est en vente sur ONIRIQUE, payé par carte et livré tout de suite.</p>

  <div class="bar glass" role="search">
    <div class="chips" id="kinds" role="group" aria-label="Rayon">
      <button type="button" data-kind="" aria-pressed="true">Tout</button>
      <button type="button" data-kind="visual" aria-pressed="false">Pochettes et visuels</button>
      <button type="button" data-kind="pack" aria-pressed="false">Packs de prods</button>
    </div>
    <input type="search" id="q" placeholder="Titre ou vendeur" aria-label="Rechercher un titre ou un vendeur">
    <select id="sort" aria-label="Trier">
      <option value="recent">Plus récents</option>
      <option value="cheap">Prix croissant</option>
      <option value="dear">Prix décroissant</option>
    </select>
  </div>

  <!-- Sans filtre : la une, puis un rayon par type. -->
  <div id="home">
    <a class="hero glass" id="hero" hidden></a>
    <section class="shelf" data-shelf="visual"><header><h2>Pochettes et visuels</h2><button type="button" data-all="visual">Voir tout</button></header><div class="cards row"></div></section>
    <section class="shelf" data-shelf="pack"><header><h2>Packs de prods</h2><button type="button" data-all="pack">Voir tout</button></header><div class="cards row"></div></section>
  </div>
  <!-- Avec un rayon choisi ou une recherche : tous les résultats. -->
  <section class="shelf" id="results" hidden><header><h2 id="results-title"></h2><span class="muted" id="results-count"></span></header><div class="cards" id="grid"></div></section>
  <p class="muted" id="state" role="status">Chargement…</p>
</main>
<script src="assets/marketplace.js?v=1"></script>
<script>
// La marketplace : les visuels en vente de la vitrine (copies filigranées) et les packs de prods achetables, réunis par
// /api/marketplace. Chaque carte mène à la fiche de l'article (article.html). Rayon, recherche et tri restent dans l'adresse.
const { el, card, list, KIND, noSave, priceText, sellerText } = Market;
const $ = (id) => document.getElementById(id);
const RAYON = { visual: "Pochettes et visuels", pack: "Packs de prods" };
const params = new URLSearchParams(location.search);
let items = null, kind = RAYON[params.get("type")] ? params.get("type") : "";
$("q").value = params.get("q") || "";
if (["cheap", "dear"].includes(params.get("tri"))) $("sort").value = params.get("tri");

const sorted = (xs) => { const s = $("sort").value; return [...xs].sort((a, b) => (s === "cheap" ? a.price - b.price : s === "dear" ? b.price - a.price : b.at - a.at)); };
function draw() {
  if (!items) return;
  document.querySelectorAll("#kinds button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.kind === kind)));
  const q = $("q").value.trim().toLowerCase(), sort = $("sort").value;
  const query = new URLSearchParams({ ...(kind ? { type: kind } : {}), ...(q ? { q } : {}), ...(sort !== "recent" ? { tri: sort } : {}) }).toString();
  history.replaceState(null, "", "marketplace" + (query ? "?" + query : ""));
  $("state").hidden = !!items.length;
  $("state").textContent = "Rien en vente pour l'instant.";
  const filtering = !!(kind || q);
  $("home").hidden = filtering || !items.length;
  $("results").hidden = !filtering;
  if (filtering) {
    const found = sorted(items.filter((x) => (!kind || x.type === kind) && (!q || (x.title + " " + x.seller.name + " " + (x.seller.handle || "")).toLowerCase().includes(q))));
    $("results-title").textContent = q ? "Résultats" + (kind ? " · " + RAYON[kind] : "") : RAYON[kind];
    $("results-count").textContent = found.length + " article" + (found.length > 1 ? "s" : "");
    $("grid").replaceChildren(...(found.length ? found.map(card) : [el("p", { className: "muted", textContent: q ? "Rien ne correspond à ta recherche." : "Rien dans ce rayon pour l'instant." })]));
    return;
  }
  // La une : le dernier article publié qui a une image.
  const top = items.find((x) => x.image);
  $("hero").hidden = !top;
  if (top) {
    $("hero").href = top.page;
    $("hero").replaceChildren(el("span", { className: "pic" }, noSave(el("img", { src: top.image, alt: top.title }))),
      el("div", {}, el("span", { className: "eyebrow", textContent: "À la une · " + KIND[top.type] }), el("h2", { textContent: top.title }),
        el("p", { className: "muted", style: "margin:0 0 14px", textContent: sellerText(top) }),
        el("div", { className: "between", style: "display:flex;align-items:center;gap:14px;flex-wrap:wrap" },
          el("span", { className: "price", style: "font-size:22px", textContent: priceText(top) }), el("span", { className: "btn btn-primary small", textContent: "Voir l'article" }))));
  }
  for (const shelf of document.querySelectorAll("[data-shelf]")) {
    const xs = sorted(items.filter((x) => x.type === shelf.dataset.shelf)).slice(0, 12);
    shelf.hidden = !xs.length;
    shelf.querySelector(".cards").replaceChildren(...xs.map(card));
  }
}
const pick = (k) => { kind = k; draw(); scrollTo({ top: 0, behavior: "smooth" }); };
document.querySelectorAll("#kinds button").forEach((b) => b.onclick = () => pick(b.dataset.kind));
document.querySelectorAll("[data-all]").forEach((b) => b.onclick = () => pick(b.dataset.all));
$("q").oninput = draw;
$("sort").onchange = draw;
list().then((xs) => { items = xs; draw(); }).catch(() => { $("state").textContent = "Serveur injoignable. Réessaie dans un instant."; });
</script>
</html>
