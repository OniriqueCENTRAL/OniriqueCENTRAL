<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<script src="assets/i18n.js?v=25e3ff48"></script>
<script src="assets/ui.js?v=4"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONIRIQUE — Pack de pochettes</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="assets/favicon.png?v=2">
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/marketplace.css?v=3">
<link rel="stylesheet" href="/assets/da.css?v=7">
<script src="/assets/accent.js?v=1"></script>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img src="assets/logo-small.png" alt="Logo Onirique" width="160" height="145">ONIRIQUE</a>
    <nav class="nav"><a class="btn btn-ghost small" href="marketplace">Marketplace</a></nav>
  </div>
</header>
<main class="wrap">
  <p class="muted" id="state" role="status">Chargement…</p>
  <section id="pack" hidden>
    <span class="eyebrow" id="count"></span>
    <h1 id="title"></h1>
    <div class="between" style="display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin:14px 0 6px" id="who"></div>
    <p class="desc" id="message" hidden style="max-width:680px;margin:10px 0 0"></p>
    <div class="cards" id="grid" style="margin-top:26px"></div>
    <p class="note" style="margin-top:22px">Les images sont des copies réduites avec le filigrane du graphiste. L'original, sans filigrane, est livré à l'achat.</p>
  </section>
</main>
<script src="assets/marketplace.js?v=1"></script>
<script>
// Un pack de pochettes envoyé par un graphiste depuis ONIRIQUE CLOUD : ses visuels (copies filigranées), chacun menant à
// sa fiche (achat), et de quoi écrire au graphiste. ?r= : le destinataire du mail, compté comme venu voir le pack.
const { el, euros, noSave } = Market;
const $ = (id) => document.getElementById(id);
const TOKEN = "onirique.token";
const token = sessionStorage.getItem(TOKEN) || localStorage.getItem(TOKEN);
const params = new URLSearchParams(location.search);

async function load() {
  let p;
  try {
    const response = await fetch("/api/cover-packs/" + encodeURIComponent(params.get("t") || "") + (params.get("r") ? "?r=" + encodeURIComponent(params.get("r")) : ""), { cache: "no-store" });
    p = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(p.error || "Pack introuvable.");
  } catch (error) { $("state").textContent = error.message; return; }
  // Le lien suivi ne compte qu'une fois : on le retire de l'adresse.
  if (params.get("r")) history.replaceState(null, "", "pochettes?t=" + encodeURIComponent(params.get("t")));
  document.title = p.title + " — pochettes de " + p.author.name;
  $("count").textContent = "Pack de pochettes · " + p.visuals.length + " visuel" + (p.visuals.length > 1 ? "s" : "");
  $("title").textContent = p.title;
  const a = p.author, avatar = el("img", { src: a.avatar ? a.avatar + "?w=160" : "assets/favicon.png?v=2", alt: "" });
  $("who").replaceChildren(
    a.handle ? el("a", { className: "seller", href: "profil?u=" + encodeURIComponent(a.handle) }, avatar, el("div", {}, el("b", { textContent: a.name }), el("span", { textContent: "@" + a.handle })))
      : el("div", { className: "seller" }, avatar, el("div", {}, el("b", { textContent: a.name }))),
    a.handle ? el("a", { className: "btn btn-primary small", href: token ? "messages?u=" + encodeURIComponent(a.handle) : "compte", textContent: token ? "Écrire au graphiste" : "Se connecter pour écrire" }) : null);
  $("message").textContent = p.message.replace(/\s*\{nom\}/gi, "").replace(/ +([,.!?])/g, "$1");
  $("message").hidden = !p.message;
  $("grid").replaceChildren(...(p.visuals.length ? p.visuals.map((v) => el("a", { className: "card", href: "article?v=" + v.id },
    el("span", { className: "pic" }, noSave(el("img", { src: v.image, alt: v.title, loading: "lazy" }))),
    el("b", { textContent: v.title }),
    el("small", { textContent: v.unique ? "Pièce unique" : v.width + " × " + v.height + " px" }),
    el("span", { className: "price", textContent: v.sold ? "Vendu" : v.price ? euros(v.price) : "Sur demande" })))
    : [el("p", { className: "muted", textContent: "Ce pack est vide pour l'instant." })]));
  $("state").hidden = true;
  $("pack").hidden = false;
}
load();
</script>
</html>
