<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Patch notes ONIRIQUE</title>
<!-- Les images des patch notes Discord (charte Nuit & Braise). Rendu : tools/patchnotes/render.js -->
<style>
@font-face { font-family: "Unbounded"; font-weight: 200 900; src: url(../../site/assets/fonts/Unbounded-latin.woff2) format("woff2"); }
@font-face { font-family: "Hanken Grotesk"; font-weight: 100 900; src: url(../../site/assets/fonts/HankenGrotesk-latin.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 100 800; src: url(../../site/assets/fonts/JetBrainsMono-latin.woff2) format("woff2"); }
:root {
  --night: #09080A; --deep: #121012; --ember: #E5384A; --blood: #7A0D1C; --pink: #FF8E9A;
  --bone: #F4ECEC; --label: #D9C6C9; --haze: #A8939A; --line: rgba(255, 210, 214, .13);
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow: hidden; background: var(--night); color: var(--bone); }
.vue { display: none; position: relative; overflow: hidden; }
.vue.on { display: block; }

/* La bannière d'en-tête : 1600 × 560 */
#banner {
  width: 1600px; height: 560px;
  background:
    radial-gradient(760px 520px at 0% 0%, rgba(122, 13, 28, .66), transparent 70%),
    radial-gradient(700px 520px at 100% 100%, rgba(122, 13, 28, .52), transparent 70%),
    radial-gradient(420px 320px at 78% 40%, rgba(229, 56, 74, .14), transparent 70%),
    var(--night);
}
#banner .logo { position: absolute; right: 56px; top: 50%; width: 460px; transform: translateY(-50%) rotate(-4deg); opacity: .92;
  filter: drop-shadow(0 0 26px rgba(229, 56, 74, .45)) drop-shadow(0 0 2px rgba(255, 142, 154, .6)); }
#banner .texte { position: absolute; left: 96px; top: 104px; }
.surtitre { font: 600 19px "JetBrains Mono", monospace; letter-spacing: .3em; color: var(--haze); text-transform: uppercase; }
.surtitre b { color: var(--pink); font-weight: 600; }
#banner h1 { margin: 26px 0 0; font: 900 118px/.95 "Unbounded", sans-serif; letter-spacing: -.015em; }
#banner h1 em { font-style: normal; color: var(--ember); }
#banner p { margin: 30px 0 0; font: 400 30px/1.35 "Hanken Grotesk", sans-serif; color: var(--label); }
#banner p b { color: var(--bone); font-weight: 700; }
#banner .filet { position: absolute; left: 96px; bottom: 64px; width: 220px; height: 3px; background: linear-gradient(90deg, var(--ember), transparent); }

/* Les vignettes des rubriques : 512 × 512 */
.tuile {
  width: 512px; height: 512px;
  background:
    radial-gradient(360px 320px at 50% 0%, rgba(122, 13, 28, .75), transparent 72%),
    radial-gradient(300px 260px at 50% 60%, rgba(229, 56, 74, .12), transparent 70%),
    var(--deep);
}
.tuile svg.icone { position: absolute; left: 50%; top: 50%; width: 250px; height: 250px; transform: translate(-50%, -50%);
  fill: none; stroke: var(--bone); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
  filter: drop-shadow(0 0 18px rgba(229, 56, 74, .55)); }
.tuile svg.icone .braise { stroke: var(--ember); }
.tuile .etoile { position: absolute; right: 64px; top: 58px; width: 54px; height: 54px; fill: var(--pink); filter: drop-shadow(0 0 10px rgba(255, 142, 154, .8)); }
</style>
</head>
<body>
<section class="vue" id="banner">
  <div class="texte">
    <div class="surtitre"><b>ONIRIQUE</b> · Journal des mises à jour</div>
    <h1>Patch notes<em>.</em></h1>
    <p>Tout ce qui change sur <b>le site</b>, <b>l’app</b><br>et <b>les plugins</b>.</p>
  </div>
  <img class="logo" src="../../site/assets/logo.png" alt="">
  <div class="filet"></div>
</section>

<template id="etoile"><svg class="etoile" viewBox="0 0 24 24"><path d="M12 0 L13.6 10.4 L24 12 L13.6 13.6 L12 24 L10.4 13.6 L0 12 L10.4 10.4 Z"/></svg></template>

<!-- Une vignette par rubrique des patch notes (deploy/patchnote.mjs fait le lien rubrique → image). -->
<section class="vue tuile" id="cloud"><svg class="icone" viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4.75 4.75 0 0 1-.5 9.5Z"/><path class="braise" d="M12 15V10m-2 2 2-2 2 2"/></svg></section>
<section class="vue tuile" id="packs"><svg class="icone" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M7 5v8m4-8v8m4-8v8m-10 0v6m4-6v6m4-6v6m4-6v6"/><path class="braise" d="M6 5v8M14 5v8"/></svg></section>
<section class="vue tuile" id="mails"><svg class="icone" viewBox="0 0 24 24"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="m3.5 6.5 8.5 6.5 8.5-6.5"/><circle class="braise" cx="19" cy="6" r="2.4"/></svg></section>
<section class="vue tuile" id="youtube"><svg class="icone" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="3.5"/><path class="braise" d="m10 9.2 5 2.8-5 2.8Z"/></svg></section>
<section class="vue tuile" id="plugins"><svg class="icone" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="4.4"/><path class="braise" d="M12 12 9.2 8.6"/><path d="M12 2.5v1.5M21.5 12H20M4 12H2.5M18.7 5.3l-1 1M5.3 5.3l1 1M18.7 18.7l-1-1M5.3 18.7l1-1"/></svg></section>
<section class="vue tuile" id="application"><svg class="icone" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12.5" rx="1.5"/><path d="M8.5 20h7M12 16.5V20"/><path class="braise" d="M7 12.5l2.5-3 2 2 3-4 2.5 3"/></svg></section>
<section class="vue tuile" id="site"><svg class="icone" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 3.8 5.6 3.8 9s-1.2 6.4-3.8 9c-2.6-2.6-3.8-5.6-3.8-9S9.4 5.6 12 3Z"/><path class="braise" d="M5.2 6.5h13.6"/></svg></section>
<section class="vue tuile" id="discord"><svg class="icone" viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="13.5" width="4" height="6" rx="1.5"/><rect x="17" y="13.5" width="4" height="6" rx="1.5"/><path class="braise" d="M10 15.5v-3m2 4.5v-6m2 4.5v-3"/></svg></section>
<section class="vue tuile" id="navigateur"><svg class="icone" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="1.8"/><path d="M3 8.5h18"/><circle class="braise" cx="6" cy="6.5" r=".6"/><path class="braise" d="M8.5 13.5h7"/></svg></section>
<section class="vue tuile" id="correctifs"><svg class="icone" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.1l-5.6 5.6a1.4 1.4 0 0 0 2 2l5.6-5.6a4 4 0 0 0 5.1-5.4l-2.4 2.4-2.1-.6-.6-2.1Z"/><path class="braise" d="M17 17.5l2.5 2.5"/></svg></section>
<section class="vue tuile" id="autre"><svg class="icone" viewBox="0 0 24 24"><path class="braise" d="M12 3.5 13.6 10.4 20.5 12 13.6 13.6 12 20.5 10.4 13.6 3.5 12 10.4 10.4Z"/></svg></section>

<script>
for (const t of document.querySelectorAll('.tuile')) if (t.id !== 'autre') t.append(document.getElementById('etoile').content.cloneNode(true));
// render.js montre une image à la fois : show('banner'), show('cloud')…
window.show = (id) => { for (const v of document.querySelectorAll('.vue')) v.classList.toggle('on', v.id === id); const r = document.getElementById(id).getBoundingClientRect(); return [r.width, r.height]; };
window.ids = [...document.querySelectorAll('.vue')].map((v) => v.id);
show(new URLSearchParams(location.search).get('v') || 'banner');
</script>
</body>
</html>
