<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src https: http:">
  <title>ONIRIQUE CLOUD</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mini.css">
</head>
<body>
  <!-- Le mini lecteur de CLOUD : flottant, il se déplace en le tenant par n'importe quel endroit hors des boutons. -->
  <div class="mini" id="mini">
    <img id="cover" alt="" hidden>
    <span class="cover-ph" id="cover-ph"></span>
    <div class="what"><b id="title"></b><small id="sub"></small></div>
    <button class="ctl" type="button" id="toggle" aria-label="Lecture ou pause"></button>
    <input class="vol" type="range" id="vol" min="0" max="1" step="0.01" aria-label="Volume">
    <button class="ctl small" type="button" id="open" aria-label="Revenir à ONIRIQUE CLOUD" title="Revenir à ONIRIQUE CLOUD">↗</button>
  </div>
  <script src="mini.js"></script>
</body>
</html>
