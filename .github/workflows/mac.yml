# Construit ONIRIQUE CENTRAL pour Mac (Intel et Apple Silicon dans la même application).
# Une application Mac ne se construit que sur macOS : GitHub prête la machine.
# À lancer depuis l'onglet « Actions » du dépôt GitHub, bouton « Run workflow », ou en poussant une étiquette « mac-… ».
# Le résultat (ONIRIQUE-CENTRAL.dmg) se télécharge en bas de la page de l'exécution, rubrique « Artifacts ».
# Le .dmg et le .zip de mise à jour sont aussi déposés sur le serveur : deploy/publish-mac.sh les met en ligne.
name: Application Mac

on:
  workflow_dispatch:
  push:
    tags: ['mac-*']

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Construire l'application
        working-directory: app
        run: |
          npm ci
          npm run sync-player
          npx electron-builder --mac dir --universal

      # Sans compte Apple Developer, l'application porte une signature locale (« ad hoc ») : c'est le minimum
      # pour qu'elle se lance sur un Mac Apple Silicon. macOS demandera quand même de l'autoriser à la première ouverture.
      - name: Signer localement et fabriquer l'image disque
        working-directory: app/dist
        run: |
          APP="mac-universal/ONIRIQUE CENTRAL.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          mkdir image
          cp -R "$APP" image/
          ln -s /Applications image/Applications
          hdiutil create -volname "ONIRIQUE CENTRAL" -srcfolder image -ov -format UDZO ONIRIQUE-CENTRAL.dmg
          # La même application en .zip : c'est ce que téléchargent les applications installées pour se mettre à jour.
          ditto -c -k --keepParent "$APP" ONIRIQUE-CENTRAL-mac.zip

      # La mise à jour automatique remplace l'application par le contenu du .zip (app/main/mac-swap.js) : le
      # remplacement est essayé ici, sur un vrai Mac. S'il échoue, rien n'est livré.
      - name: Essayer la mise à jour automatique
        working-directory: app/dist
        run: |
          set -e
          mkdir -p essai/Applications essai/nouveau
          cp -R "mac-universal/ONIRIQUE CENTRAL.app" essai/Applications/
          touch "essai/Applications/ONIRIQUE CENTRAL.app/Contents/ancienne-version"
          ditto -x -k ONIRIQUE-CENTRAL-mac.zip essai/nouveau
          codesign --verify --deep --strict "essai/nouveau/ONIRIQUE CENTRAL.app"
          test "$(defaults read "$PWD/essai/nouveau/ONIRIQUE CENTRAL.app/Contents/Info" CFBundleShortVersionString)" = "$(node -p "require('../package.json').version")"
          node -e "process.stdout.write(require('../main/mac-swap.js'))" > remplacer.sh
          sh -c 'exit 0' & FINI=$!; wait $FINI
          # le remplacement réussi : la nouvelle version est en place, signée, et il ne reste rien de l'ancienne
          sh -c "$(cat remplacer.sh)" sh $FINI "$PWD/essai/Applications/ONIRIQUE CENTRAL.app" "$PWD/essai/nouveau/ONIRIQUE CENTRAL.app" "$PWD/essai/nouveau" 0
          test ! -e "essai/Applications/ONIRIQUE CENTRAL.app/Contents/ancienne-version"
          codesign --verify --deep --strict "essai/Applications/ONIRIQUE CENTRAL.app"
          test ! -e "essai/Applications/ONIRIQUE CENTRAL.app.old"
          test ! -e "essai/Applications/ONIRIQUE CENTRAL.app.new"
          test ! -e essai/nouveau
          # le remplacement impossible (nouvelle version absente) : l'application d'origine reste intacte
          touch "essai/Applications/ONIRIQUE CENTRAL.app/Contents/temoin"
          if sh -c "$(cat remplacer.sh)" sh $FINI "$PWD/essai/Applications/ONIRIQUE CENTRAL.app" "$PWD/essai/absente.app" "$PWD/essai/rien" 0; then echo "un remplacement impossible a été annoncé réussi"; exit 1; fi
          test -e "essai/Applications/ONIRIQUE CENTRAL.app/Contents/temoin"
          rm -rf essai remplacer.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ONIRIQUE-CENTRAL-mac
          path: app/dist/ONIRIQUE-CENTRAL.dmg
          if-no-files-found: error

      # Dépose le fichier sur le serveur ONIRIQUE, dans /srv/livraison (voir deploy/install-livraison.sh du dépôt
      # ONIRIQUE CENTRAL). Rien n'est mis en ligne ici. Sans le secret LIVRAISON_KEY, l'étape est passée.
      - name: Livrer sur le serveur
        env:
          LIVRAISON_KEY: ${{ secrets.LIVRAISON_KEY }}
        run: |
          if [ -z "$LIVRAISON_KEY" ]; then echo "Secret LIVRAISON_KEY absent : fichier à télécharger depuis Artifacts."; exit 0; fi
          mkdir -p ~/.ssh
          # Un copier-coller depuis un terminal Windows abîme souvent la clé (retours chariot, espaces) : elle est remise en forme.
          CORPS=$(printf '%s' "$LIVRAISON_KEY" | sed -e 's/-----BEGIN OPENSSH PRIVATE KEY-----//' -e 's/-----END OPENSSH PRIVATE KEY-----//' | tr -d ' \r\n\t')
          { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; printf '%s\n' "$CORPS" | fold -w 70; echo "-----END OPENSSH PRIVATE KEY-----"; } > ~/.ssh/livraison
          chmod 600 ~/.ssh/livraison
          if ! ssh-keygen -y -f ~/.ssh/livraison > ~/.ssh/livraison.pub; then
            echo "Le secret LIVRAISON_KEY n'est pas une clé complète : recollez-la en entier, de -----BEGIN à -----END compris."
            exit 1
          fi
          # L'empreinte (publique) doit être celle qu'affiche le serveur : ssh-keygen -lf /home/livraison/.ssh/authorized_keys
          echo "Empreinte de la clé utilisée : $(ssh-keygen -lf ~/.ssh/livraison.pub)"
          echo "217.160.106.244 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICV3xBScmxJy34Jgjtvb0R4UCG3jmzkSU+/T1lDrvD/l" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/livraison -o IdentitiesOnly=yes -o BatchMode=yes livraison@217.160.106.244 central-dmg < "app/dist/ONIRIQUE-CENTRAL.dmg"
          ssh -i ~/.ssh/livraison -o IdentitiesOnly=yes -o BatchMode=yes livraison@217.160.106.244 central-mac-zip < "app/dist/ONIRIQUE-CENTRAL-mac.zip"
