<!doctype html>

<title>ONIRIQUE — L'empire anto ment</title>
<link rel="icon" type="image/png" href="/assets/favicon.png?v=2">

<style>
/* L'empire anto ment : la carte des fondateurs, dans le style de la carte des membres (plan incliné, noir et blanc) ; les mensonges d'Anto sont des « stops » qu'on fait tourner pour gagner du butin. */
:root {
  --night: #040404; --line: rgba(255,255,255,.13); --mist: #F4F4F4; --haze: #9A9A9A; --ember: #ffffff; --pink: #d6d6d6; --rose: #e8e8e8;
  --used: #6b6b6b;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--night); color: var(--mist); font: 400 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; border-radius: 6px; }
.halo { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(60% 50% at 50% 60%, rgba(255,255,255,.05), transparent 70%), radial-gradient(40% 35% at 15% 10%, rgba(255,255,255,.04), transparent 70%); }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px clamp(14px, 3vw, 28px); pointer-events: none; }
header > * { pointer-events: auto; }
.brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font: 800 16px/1 var(--f-display); letter-spacing: .16em; }
.brand img { width: 40px; height: auto; margin-block: -10px; filter: grayscale(1) drop-shadow(0 0 6px rgba(255,255,255,.6)); }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: rgba(10,10,10,.55); backdrop-filter: blur(12px);
  font: 600 13px/1 var(--f-body); text-decoration: none; cursor: pointer; color: var(--mist); }
.btn:hover { border-color: var(--ember); }

#scene { position: fixed; inset: 0; z-index: 1; perspective: 1400px; perspective-origin: 50% 40%; cursor: grab; touch-action: none; user-select: none; }
#scene.drag { cursor: grabbing; }
#plane { position: absolute; left: 50%; top: 54%; width: 2500px; height: 2500px; margin: -1250px 0 0 -1250px; transform-style: preserve-3d; }
@media (min-width: 861px) { #plane { left: calc(50% + 150px); top: 50%; } }
#plane svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.coast { fill: none; stroke: rgba(255,255,255,.85); stroke-width: 1.6; stroke-linejoin: round; stroke-dasharray: var(--len); stroke-dashoffset: var(--len);
  animation: draw 3.2s cubic-bezier(.6, .1, .2, 1) forwards; }
.coast.sea { stroke: rgba(255,255,255,.35); stroke-width: 1; animation-delay: .8s; }
.land { fill: rgba(255,255,255,.1); opacity: 0; animation: fade 2s 1.8s forwards; }
.land.sea { fill: rgba(4,4,4,.92); }
.grid { stroke: rgba(255,255,255,.07); stroke-width: .6; fill: none; }
.gridlabel { font: 500 7px var(--f-mono); fill: rgba(255,255,255,.25); }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@keyframes appear { to { opacity: var(--o, .8); } }
.sealabel { font: 500 9px var(--f-mono); letter-spacing: .3em; fill: rgba(255,255,255,.4); text-anchor: middle; text-transform: uppercase; opacity: 0; animation: fade 2s 2.4s forwards; }

/* Les stops : posés à plat au-dessus de la carte (#labels), à la position de leur monument à l'écran. */
#labels { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
.stop { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; }
.stop button { position: absolute; left: -16px; top: -46px; width: 32px; height: 50px; border: 0; padding: 0; background: none; cursor: pointer; pointer-events: auto; }
/* Le pilier, le socle qui pulse et le cube qui tourne au sommet. */
.stop .pole { position: absolute; left: 15px; top: 20px; width: 2px; height: 26px; background: linear-gradient(var(--rose), transparent); }
.stop .base { position: absolute; left: 6px; top: 40px; width: 20px; height: 8px; border-radius: 50%; border: 2px solid var(--pink); opacity: .8; }
.stop .base::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--pink); animation: ping 2.4s var(--d, 0s) ease-out infinite; }
@keyframes ping { from { transform: scale(.6); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }
.stop .gem { position: absolute; left: 6px; top: 2px; width: 20px; height: 20px; border-radius: 5px; transform-style: preserve-3d;
  background: radial-gradient(circle at 35% 30%, #fff 0 12%, var(--pink) 35%, var(--ember) 75%); box-shadow: 0 0 14px var(--ember), 0 0 30px rgba(255,255,255,.5);
  animation: gem 3.2s var(--d, 0s) linear infinite; }
@keyframes gem { from { transform: rotateX(55deg) rotateZ(0); } to { transform: rotateX(55deg) rotateZ(360deg); } }
/* Un stop peut porter son propre objet à la place du cube : il flotte et tourne sur lui-même au-dessus du pilier. */
.stop .model { position: absolute; width: var(--w, 140px); height: var(--h, 35px); left: calc(16px - var(--w, 140px) / 2); top: calc(19px - var(--h, 35px)); animation: model 4s var(--d, 0s) linear infinite, float 2.4s ease-in-out infinite alternate;
  filter: drop-shadow(0 0 6px rgba(255,255,255,.55)); }
.stop .model svg { display: block; width: 100%; height: 100%; overflow: visible; }
@keyframes model { from { transform: perspective(300px) rotateY(0); } to { transform: perspective(300px) rotateY(360deg); } }
@keyframes float { to { translate: 0 -4px; } }
.stop.used .model { opacity: .45; }
.stop.used .gem { background: radial-gradient(circle at 35% 30%, #fff 0 12%, #9a9a9a 35%, var(--used) 75%); box-shadow: 0 0 12px var(--used); }
.stop.used .base, .stop.used .base::after { border-color: var(--used); }
.stop.on button { scale: 1.3; }
.stop button:hover { scale: 1.15; }
.tag { position: absolute; left: 0; top: 0; white-space: nowrap; opacity: 0; transition: opacity .3s; will-change: transform; }
.tag.show { opacity: 1; }
/* Le monument principal : le buste d'Anto, géant, qui tourne sur son socle au cœur de l'Anatolie (36 vues sur une bande). */
.monument { position: absolute; left: 0; top: 0; width: 0; height: 0; will-change: transform; }
.monument button { position: absolute; left: -93px; top: -214px; width: 186px; height: 220px; border: 0; padding: 0; cursor: pointer; pointer-events: auto; transform-origin: 50% 100%;
  background-color: transparent; background-repeat: no-repeat; background-size: 6696px 220px; animation: bust 7.2s steps(36) infinite;
  filter: drop-shadow(0 0 14px rgba(255,255,255,.3)) drop-shadow(0 14px 16px rgba(0,0,0,.85)); }
.monument button:hover { scale: 1.05; }
@keyframes bust { to { background-position: -6696px 0; } }
@media (max-width: 860px) { .monument button { scale: .65; } .monument button:hover { scale: .7; } }
.tag b { display: block; text-align: center; font: 800 10.5px/1.1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; text-shadow: 0 0 10px #000, 0 0 3px #000; }
.tag i { display: block; text-align: center; font: 500 9.5px var(--f-mono); font-style: normal; color: var(--pink); letter-spacing: .1em; text-shadow: 0 0 8px #000; }

.glass { background: linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.02) 40%, rgba(255,255,255,.035)), rgba(8,8,8,.62);
  border: 1px solid rgba(255,255,255,.1); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 -1px 0 rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.45);
  backdrop-filter: blur(22px) saturate(140%); border-radius: 22px; }
.eyebrow { font: 500 11px/1 var(--f-mono); letter-spacing: .16em; text-transform: uppercase; color: var(--haze); display: flex; align-items: center; gap: 8px; }
.eyebrow::before { content: ""; width: 11px; height: 11px; background: var(--mist); clip-path: polygon(50% 0, 56% 44%, 100% 50%, 56% 56%, 50% 100%, 44% 56%, 0 50%, 44% 44%); filter: drop-shadow(0 0 4px var(--ember)); }
#side { position: fixed; z-index: 10; left: clamp(12px, 3vw, 28px); top: 84px; width: 320px; max-height: calc(100vh - 120px); overflow-y: auto; padding: 20px; display: grid; gap: 14px; align-content: start;
  animation: rise .8s .4s both cubic-bezier(.2, .8, .2, 1); scrollbar-width: thin; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
#side h1 { margin: 0; font: 800 22px/1.1 var(--f-display); }
#side h1 em { font-style: normal; color: var(--ember); }
.count { font: 500 12px var(--f-mono); color: var(--haze); letter-spacing: .06em; }
.count b { color: var(--mist); }
.bag { display: flex; flex-wrap: wrap; gap: 6px; }
.bag span { border: 1px solid var(--line); background: rgba(255,255,255,.03); border-radius: 999px; padding: 5px 10px; font: 600 12px var(--f-body); }
.bag span b { color: var(--pink); font: 500 11px var(--f-mono); margin-left: 4px; }
.list { display: grid; gap: 2px; }
.list button { display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; border: 0; border-radius: 10px; background: none; cursor: pointer; text-align: left; font: 600 13px var(--f-body); }
.list button:hover { background: rgba(255,255,255,.05); }
.list button small { font: 500 11px var(--f-mono); color: var(--haze); white-space: nowrap; }
.list button.used small { color: var(--used); }
.empty { color: var(--haze); font-size: 13px; margin: 0; }
.hint { font: 500 10.5px/1.5 var(--f-mono); color: var(--haze); letter-spacing: .04em; }

/* Le panneau d'un stop : le disque à faire tourner, l'histoire du monument, le butin. */
#stop { position: fixed; z-index: 11; right: clamp(12px, 3vw, 28px); top: 84px; width: 360px; max-height: calc(100vh - 110px); overflow-y: auto; padding: 22px; display: grid; gap: 14px; justify-items: center; text-align: center;
  transform: translateX(calc(100% + 40px)); transition: transform .55s cubic-bezier(.2, .8, .2, 1); }
#stop.open { transform: none; }
#stop .x { justify-self: end; margin-bottom: -40px; border: 1px solid var(--line); background: rgba(255,255,255,.04); width: 34px; height: 34px; border-radius: 10px; cursor: pointer; }
#stop h2 { margin: 0; font: 800 22px/1.15 var(--f-display); }
#stop p { margin: 0; font-size: 14px; color: #cfcfcf; text-align: left; }
.disc { width: 190px; height: 190px; border-radius: 50%; display: grid; place-items: center; font-size: 74px; cursor: pointer; border: 6px solid var(--ember); touch-action: none;
  background: radial-gradient(circle at 50% 40%, rgba(255,255,255,.25), transparent 60%), conic-gradient(from 0deg, #111, #2a2a2a, #111, #2a2a2a, #111);
  box-shadow: 0 0 0 6px rgba(255,255,255,.06), 0 0 40px rgba(255,255,255,.6), inset 0 0 30px rgba(0,0,0,.6); transition: border-color .4s, box-shadow .4s; }
.disc { filter: grayscale(1); }
.disc.spin { animation: spin 1.1s cubic-bezier(.2, .7, .3, 1); }
@keyframes spin { to { transform: rotate(1080deg); } }
.disc.used { border-color: var(--used); box-shadow: 0 0 0 6px rgba(255,255,255,.06), 0 0 30px rgba(255,255,255,.15), inset 0 0 30px rgba(0,0,0,.6); cursor: default; }
.go { padding: 12px 22px; border-radius: 999px; border: 0; background: var(--mist); color: #0a0a0a; font: 700 14px var(--f-body); cursor: pointer; }
.go:disabled { background: rgba(255,255,255,.08); color: var(--haze); cursor: default; }
.loot { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 10px; }
.loot span { padding: 8px 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,.6); background: rgba(255,255,255,.15); font: 700 13px var(--f-body); animation: pop .6s both cubic-bezier(.2, 1.6, .4, 1); animation-delay: calc(var(--i) * 120ms); }
.loot span.rare { border-color: #ffffff; background: rgba(255,255,255,.22); }
@keyframes pop { from { opacity: 0; transform: translateY(30px) scale(.4); } }
#zoom { position: fixed; z-index: 10; right: clamp(12px, 3vw, 28px); bottom: 18px; display: grid; gap: 6px; }
#zoom button { width: 42px; height: 42px; border-radius: 12px; cursor: pointer; font: 700 18px var(--f-body); }
#intro { position: fixed; z-index: 30; inset: 0; display: grid; place-items: center; pointer-events: none; font: 800 clamp(22px, 4vw, 40px)/1.1 var(--f-display); letter-spacing: .2em; text-align: center;
  animation: intro 2.6s forwards; text-shadow: 0 0 30px rgba(255,255,255,.8); }
#intro small { display: block; margin-top: 12px; font: 500 12px var(--f-mono); letter-spacing: .3em; color: var(--pink); }
@keyframes intro { 0% { opacity: 0; transform: scale(.96); } 25%, 60% { opacity: 1; transform: none; } 100% { opacity: 0; transform: scale(1.04); visibility: hidden; } }
@media (max-width: 860px) {
  #side { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; max-height: 30vh; padding: 14px; }
  body.stop-open #side { display: none; }
  #plane { top: 40%; }
  #stop { left: 12px; right: 12px; top: auto; bottom: 12px; width: auto; max-height: 70vh; transform: translateY(calc(100% + 30px)); }
  #zoom { top: 76px; bottom: auto; right: 12px; }
  body.stop-open #zoom { display: none; }
  .hide-phone { display: none; }
}
@media (pointer: coarse) { .coast { filter: none; } .glass, .btn { backdrop-filter: none; } .glass { background: rgba(10,10,10,.93); } .list button { min-height: 44px; align-items: center; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; transition: none !important; } }
</style>

const LOOT = [["Loukoum", 18], ["Café turc", 16], ["Simit", 14], ["Baklava", 12], ["Tulipe", 10], ["Akçe", 10], ["Babouche", 8], ["Œil nazar", 6], ["Firman du sultan", 3, true], ["Tapis volant", 1.5, true], ["Turban de vizir", 1.5, true]];
const COOLDOWN = 5 * 60 * 1000; // un stop se recharge en 5 minutes
const STORE = "onirique.empire";
const load = () => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; } };
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch { /* stockage fermé : le butin dure le temps de la page */ } };
const state = Object.assign({ bag: {}, spun: {} }, load());
const usedNow = (id) => Date.now() - (state.spun[id] || 0) < COOLDOWN;
function draw() {
  const total = Object.values(state.bag).reduce((t, n) => t + n, 0);
  $("count").innerHTML = `<b>${STOPS.length}</b> mensonges · <b>${STOPS.filter((x) => state.spun[x.id]).length}</b> visités · <b>${total}</b> objets`;
  const bag = Object.entries(state.bag).sort((a, b) => b[1] - a[1]);
  $("bag").replaceChildren(...(bag.length ? bag.map(([k, n]) => el("span", {}, k, el("b", { textContent: "×" + n }))) : [el("p", { className: "empty", textContent: "Rien encore : fais tourner un stop." })]));
  $("list").replaceChildren(...STOPS.map((s) => el("button", { type: "button", className: usedNow(s.id) ? "used" : "", onclick: () => openStop(s.id) }, s.name, el("small", { textContent: s.city }))));
  for (const s of STOPS) s.node?.classList.toggle("used", usedNow(s.id));
}


//------------------------------------------------------------------------------ Les contours en constellation
const pathOf = (pts) => "M" + pts.map(([lon, lat]) => project(lon, lat).map((v) => v.toFixed(1)).join(",")).join("L") + "Z";
function trace(group, pts, cls) {
  const d = pathOf(pts);
  group.append(svgEl("path", { d, class: "land" + cls }));
  const path = svgEl("path", { d, class: "coast" + cls });
  group.append(path);
  const len = path.getTotalLength();
  path.style.setProperty("--len", len);
}
function drawShapes() {
  // Le quadrillage des méridiens et des parallèles, tous les 5 degrés, comme sur une carte ancienne.
  for (let lon = 0; lon <= 50; lon += 5) { const [x1, y1] = project(lon, 52), [x2, y2] = project(lon, 12); $("grid").append(svgEl("line", { x1, y1, x2, y2, class: "grid" })); const t = svgEl("text", { x: x1 + 3, y: project(lon, 13)[1], class: "gridlabel" }); t.textContent = lon + "°E"; $("grid").append(t); }
  for (let lat = 15; lat <= 50; lat += 5) { const [x1, y1] = project(-4, lat), [x2, y2] = project(52, lat); $("grid").append(svgEl("line", { x1, y1, x2, y2, class: "grid" })); const t = svgEl("text", { x: project(-3.5, lat)[0], y: y1 - 3, class: "gridlabel" }); t.textContent = lat + "°N"; $("grid").append(t); }
  for (const pts of Object.values(EMPIRE)) trace($("lands"), pts, "");
  for (const [name, sea] of Object.entries(SEAS)) {
    trace($("seas"), sea.pts, " sea");
    const [x, y] = project(...sea.at), t = svgEl("text", { x, y, class: "sealabel" });
    t.textContent = name; $("seas").append(t);
  }
}

//------------------------------------------------------------------------------ La caméra (reprise de la carte des membres)
const K = 2.5, PERSP = 1400;
const cam = { ax: 12, az: -30, z: .55, px: 0, py: 0 }, goal = { ...cam };
const fit = () => Math.min(1.5, Math.max(.3, Math.min(innerWidth / (innerWidth > 860 ? 1050 : 820), innerHeight / 760)));
const ZMAX = 40;
function home() { Object.assign(goal, { ax: 45, az: -6, z: fit(), px: 0, py: 0 }); }
function flyTo(x, y, z = 3) { Object.assign(goal, { ax: 42, az: -4, z: Math.min(ZMAX, z) * fit(), px: (500 - x) * K, py: (500 - y) * K }); }
let lastView = "", current = null;
function tick(t) {
  for (const k of ["ax", "az", "z", "px", "py"]) { cam[k] += (goal[k] - cam[k]) * (reduced ? 1 : .065); if (Math.abs(goal[k] - cam[k]) < 1e-3) cam[k] = goal[k]; }
  const sway = still ? 0 : Math.sin(t / 4200) * 1.4, swayX = still ? 0 : Math.sin(t / 5300) * 1.2;
  const plane = $("plane"), view = [(cam.ax + swayX).toFixed(3), (cam.az + sway).toFixed(3), (cam.z / K).toFixed(5), cam.px.toFixed(2), cam.py.toFixed(2)];
  if (view.join() !== lastView) {
    lastView = view.join();
    const tf = `rotateX(${view[0]}deg) rotateZ(${view[1]}deg) scale(${view[2]}) translate(${view[3]}px, ${view[4]}px)`;
    plane.style.transform = tf;
    const m = new DOMMatrix(tf), cx = plane.offsetLeft + 1250, cy = plane.offsetTop + 1250, ox = innerWidth / 2, oy = innerHeight * .4;
    const near = cam.z / fit() > 2.2; // de près, tous les noms ; de loin, les plus grands monuments
    const place = (s) => {
      const p = m.transformPoint(new DOMPoint(s.x * K - 1250, s.y * K - 1250)), f = PERSP / (PERSP - p.z);
      return `translate(${(ox + (cx + p.x - ox) * f).toFixed(1)}px, ${(oy + (cy + p.y - oy) * f).toFixed(1)}px)`;
    };
    const bust = place(BUST);
    BUST.node.style.transform = bust;
    BUST.tag.style.transform = `${bust} translate(-50%, calc(-100% - ${innerWidth > 860 ? 222 : 150}px))`;
    for (const s of STOPS) {
      const at = place(s);
      s.node.style.transform = at;
      s.tag.style.transform = `${at} translate(-50%, calc(-100% - ${s.model ? 31 + (s.h || 35) : 52}px))`;
      s.tag.classList.toggle("show", near || s.major || current === s.id);
    }
  }
  requestAnimationFrame(tick);
}

(function controls() {
  const scene = $("scene"), pts = new Map();
  let spin = false, pinch = null;
  const tilt = (d) => { goal.ax = Math.min(72, Math.max(0, goal.ax + d)); };
  const zoomBy = (f) => { goal.z = Math.min(ZMAX * fit(), Math.max(.4 * fit(), goal.z * f)); };
  const pair = () => { const [p, q] = [...pts.values()]; return { x: (p.x + q.x) / 2, y: (p.y + q.y) / 2, d: Math.hypot(q.x - p.x, q.y - p.y), a: Math.atan2(q.y - p.y, q.x - p.x) }; };
  for (const layer of [scene, $("labels")]) layer.addEventListener("contextmenu", (e) => e.preventDefault());
  scene.addEventListener("dragstart", (e) => e.preventDefault());
  const down = (e) => {
    if (e.pointerType === "mouse") e.preventDefault();
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) spin = e.button === 2;
    pinch = pts.size === 2 ? pair() : null;
    scene.classList.add("drag"); scene.setPointerCapture(e.pointerId);
  };
  scene.addEventListener("pointerdown", down);
  $("labels").addEventListener("pointerdown", (e) => { if (e.button === 2) down(e); });
  scene.addEventListener("pointermove", (e) => {
    const was = pts.get(e.pointerId);
    if (!was) return;
    const dx = e.clientX - was.x, dy = e.clientY - was.y;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size >= 2) {
      if (!pinch || pts.size > 2) return;
      const now = pair();
      if (pinch.d > 0) zoomBy(now.d / pinch.d);
      let da = (now.a - pinch.a) * 180 / Math.PI;
      if (da > 180) da -= 360; else if (da < -180) da += 360;
      goal.az += da; tilt(-(now.y - pinch.y) * .25); pinch = now;
      return;
    }
    if (spin) { goal.az += dx * .35; tilt(-dy * .25); return; }
    const a = -goal.az * Math.PI / 180, zk = goal.z / K, ux = (dx * Math.cos(a) - dy * Math.sin(a)) / zk, uy = (dx * Math.sin(a) + dy * Math.cos(a)) / zk / Math.max(.3, Math.cos(goal.ax * Math.PI / 180));
    goal.px += ux; goal.py += uy; cam.px += ux; cam.py += uy;
  });
  const end = (e) => { pts.delete(e.pointerId); pinch = pts.size === 2 ? pair() : null; if (!pts.size) scene.classList.remove("drag"); };
  scene.addEventListener("pointerup", end); scene.addEventListener("pointercancel", end);
  scene.addEventListener("wheel", (e) => { e.preventDefault(); zoomBy(Math.exp(-e.deltaY / 600)); }, { passive: false });
  $("zoom-in").onclick = () => zoomBy(1.4);
  $("zoom-out").onclick = () => zoomBy(1 / 1.4);
  $("view-flat").onclick = () => { goal.ax = goal.ax > 20 ? 0 : 45; };
  $("zoom-reset").onclick = () => { closeStop(); home(); };
  addEventListener("resize", () => { if (!current) home(); });
})();

//------------------------------------------------------------------------------ Les stops
function drawStops() {
  [BUST.x, BUST.y] = project(BUST.lon, BUST.lat);
  BUST.node = el("div", { className: "monument" }, el("button", { type: "button", ariaLabel: "Le buste d'Anto, monument principal de l'empire", style: `background-image:url(${BUST.sprite})`,
    onclick: () => { closeStop(); flyTo(BUST.x, BUST.y, 2.5); } }));
  BUST.tag = el("div", { className: "tag show" }, el("b", { textContent: BUST.name }), el("i", { textContent: BUST.city }));
  $("labels").prepend(BUST.node, BUST.tag); // sous les stops
  STOPS.forEach((s, i) => {
    [s.x, s.y] = project(s.lon, s.lat);
    s.node = el("div", { className: "stop", style: `--d:${(i * .37 % 2.4).toFixed(2)}s` },
      el("button", { type: "button", ariaLabel: s.name + ", " + s.city, onclick: () => openStop(s.id) }, el("span", { className: "pole" }), el("span", { className: "base" }), (s.model ? el("span", { className: "model", innerHTML: s.model, style: s.w ? `--w:${s.w}px;--h:${s.h}px` : "" }) : el("span", { className: "gem" }))));
    s.tag = el("div", { className: "tag" }, el("b", { textContent: s.name }), el("i", { textContent: s.city }));
    $("labels").append(s.node, s.tag);
  });
}
function openStop(id) {
  const s = STOPS.find((x) => x.id === id);
  current = id; lastView = "";
  for (const o of STOPS) o.node.classList.toggle("on", o.id === id);
  $("stop-city").textContent = s.city;
  $("stop-name").textContent = s.name;
  $("disc").textContent = s.icon;
  $("stop-text").textContent = s.text || "";
  $("stop-text").hidden = !s.text;
  $("loot").replaceChildren();
  refreshSpin();
  $("stop").classList.add("open"); document.body.classList.add("stop-open");
  flyTo(s.x, s.y, 4);
}
function refreshSpin() {
  if (!current) return;
  const used = usedNow(current), left = Math.ceil((COOLDOWN - (Date.now() - (state.spun[current] || 0))) / 60000);
  $("disc").classList.toggle("used", used);
  $("spin").disabled = used;
  $("spin").textContent = used ? `Recharge… encore ${left} min` : "Faire tourner";
}
function spinStop() {
  if (!current || usedNow(current)) return;
  const disc = $("disc");
  disc.classList.remove("spin"); void disc.offsetWidth; disc.classList.add("spin");
  const total = LOOT.reduce((t, l) => t + l[1], 0), got = [];
  for (let i = 0; i < 3 + Math.floor(Math.random() * 3); i++) {
    let r = Math.random() * total;
    got.push(LOOT.find((l) => (r -= l[1]) < 0) || LOOT[0]);
  }
  for (const [name] of got) state.bag[name] = (state.bag[name] || 0) + 1;
  state.spun[current] = Date.now();
  save();
  setTimeout(() => {
    $("loot").replaceChildren(...got.map(([name, , rare], i) => el("span", { className: rare ? "rare" : "", style: `--i:${i}`, textContent: "+1 " + name })));
    refreshSpin(); draw();
  }, reduced ? 0 : 900);
}
function closeStop() { current = null; lastView = ""; $("stop").classList.remove("open"); document.body.classList.remove("stop-open"); for (const o of STOPS) o.node.classList.remove("on"); }
$("spin").onclick = spinStop;
$("disc").onclick = spinStop;
$("disc").onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); spinStop(); } };
$("stop-close").onclick = () => { closeStop(); home(); };
addEventListener("keydown", (e) => { if (e.key === "Escape") { closeStop(); home(); } });
setInterval(() => { refreshSpin(); draw(); }, 30000); // les stops se rechargent

drawShapes();
drawStops();
draw();
requestAnimationFrame(tick);
setTimeout(() => $("intro").remove(), reduced ? 0 : 2700);
setTimeout(home, reduced ? 0 : 500);
</script>
</html>
